# Gitleaks configuration.
#
# Purpose: record proven non-secret literals that the default rule set reports, so the
# Full-history secret scan can distinguish them from real credentials. This is not a
# path exclusion, rule disable, or broad pattern.
#
# Adding an entry requires recorded evidence that the literal is not a credential.

[extend]
useDefault = true

[allowlist]
description = "Known non-secret identifiers"
regexTarget = "secret"
regexes = [
  '''^arkadia[.]ais[.]diagnostic-handoff[.]v1$''',
  '''^arkadia[.]ais[.]capability-portfolio[.]v1$''',
  '''^EXAVITQu4vr4xnSDxMaL$''',
  # Prose fragment from docs/control-plane/parallel-ui/SHARED-CONTRACTS.md, where the
  # neighbouring word "tokens" makes gitleaks' generic-api-key heuristic score
  # "NovaNet/Solariun" as a candidate secret (entropy 3.625). It is two surface names,
  # not a credential, and the finding lives in the commit that introduced it, so a
  # tip-side reword cannot clear the ranged scan.
  '''^NovaNet/Solariun$''',
]
