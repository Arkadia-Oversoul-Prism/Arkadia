services:
  - type: web
    runtime: static
    name: arkadia-prism-render
    rootDir: web/public_prism
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://arkadia-kw64.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
