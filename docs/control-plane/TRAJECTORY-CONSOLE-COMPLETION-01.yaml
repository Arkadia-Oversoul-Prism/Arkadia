trajectory:
  id: ARKADIA-CONSOLE-COMPLETION-01
  version: 1
  status: authorized-for-review-gated-execution
  objective: Complete the native Console gates without widening authority boundaries, using one bounded engineering move per Weaver session.
  execution_mode: dependency-aware-sequential
  max_active_moves: 1
  review_gate: required_after_every_move
  merge: human_only
  production_deploy: human_only
  constitutional_changes: prohibited
  entry_frontier:
    current_gate: G12
    reason: G12 implementation is the active repository frontier; G11 remains a prerequisite boundary and must not be silently reopened unless fresh evidence shows it is required for the selected move.
    current_pr: 307
    current_pr_status: open-draft
    current_head: dda2061e884abe200f6c7b7035caff6cf1eb8cc8
    current_base: b79d7ef7ef9a80c11a53e695a59a9540ab082478
  governance:
    forbidden:
      - identity
      - authorization_semantics
      - provenance_semantics
      - WorkEvent_semantics_redefinition
      - K15_K3
      - autonomous_merge
      - autonomous_production_deploy
      - autonomous_next_move
    rule: The worker may implement one bounded move and record evidence, but cannot promote evidence to human acceptance, merge, deploy, or choose a second move in the same session.
  moves:
    - id: G12-A
      name: canonical-capture-reconciliation
      status: in_progress
      depends_on: []
      packet: console-offline-sync
      spec: docs/control-plane/moves/G12-A-capture-reconciliation.md
      existing_pr: 307
      completion_rule: Human review/merge plus repository acceptance evidence.
    - id: G12-B
      name: durable-offline-queue-state-machine
      status: pending
      depends_on:
        - G12-A
      packet: console-offline-sync
      spec: docs/control-plane/moves/G12-B-offline-queue.md
      completion_rule: Restart durability and acknowledgement-loss replay are verified; acceptance remains human-gated.
    - id: G12-C
      name: network-triggered-reconciliation
      status: pending
      depends_on:
        - G12-B
      packet: console-offline-sync
      spec: docs/control-plane/moves/G12-C-network-reconciliation.md
      completion_rule: Connectivity-triggered reconciliation is verified without autonomous consequential execution.
    - id: G14
      name: full-console-end-to-end
      status: pending
      depends_on:
        - G12-C
      packet: console-e2e
      spec: docs/control-plane/moves/G14-console-e2e.md
      completion_rule: Authenticated device/runtime evidence proves the canonical Console chain.
    - id: G15
      name: regression-security
      status: pending
      depends_on:
        - G14
      packet: console-release
      spec: docs/control-plane/moves/G15-regression-security.md
      completion_rule: Fresh targeted regression/security evidence is recorded; unrelated provider failures remain explicitly classified.
    - id: G16
      name: release-apk
      status: pending
      depends_on:
        - G15
      packet: console-release
      spec: docs/control-plane/moves/G16-release-apk.md
      completion_rule: Release build, artifact hash, gate ledger, and required device evidence are recorded; merge/deploy remain human-only.
  routing_invariants:
    - Select only the first legal incomplete move.
    - Never infer acceptance from merge alone.
    - Never select a dependent move while its prerequisite is still in progress.
    - A blocked or revision-required move remains the frontier.
    - One session may implement at most one move.
    - Reconstruct repository truth at every wake.
    - Existing PRs must be inspected before creating competing work.
    - G11 is not to be silently marked complete by the router; if fresh evidence shows G11 blocks the selected G12 move, stop and report the blocker.
