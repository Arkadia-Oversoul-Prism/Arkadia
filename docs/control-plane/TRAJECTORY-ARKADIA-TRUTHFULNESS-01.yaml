trajectory:
  id: ARKADIA-TRUTHFULNESS-01
  version: 5
  status: authorized-for-review-gated-execution
  objective: Turn the truthful Arkadia substrate into a coherent human experience
    while preserving human sovereignty, the canonical shell, shared runtime boundaries,
    Knowledge OS boundaries, and governed engineering execution.
  authority_level: 4
  execution_mode: dependency-aware-sequential
  max_active_moves: 1
  review_gate: required_after_every_move
  merge: human_only
  production_deploy: human_only
  constitutional_changes: prohibited
  strategic_horizon:
    id: H02
    name: human-experience
    status: active
    objective: Turn the coherent Arkadia substrate into a coherent daily human experience
      without architectural drift.
  north_star:
    statement: Arkadia exists to reduce the cognitive burden of living and building
      in a distributed intelligence world while preserving the human as the final
      source of meaning, authority, and decision.
    move_readiness_test:
    - What human problem disappears?
    - Which existing Arkadia surface becomes more truthful?
    - Which existing substrate does it reuse?
    - What new continuity does it create?
    - What boundary must remain untouched?
    - What observable evidence proves it works?
    readiness_rule: A move is not ready for authorization unless all six questions
      are answerable clearly.
