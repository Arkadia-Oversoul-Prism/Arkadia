routing_invariants:
- The first legal incomplete move is selected from repository state, not chat history.
- A move cannot advance until dependencies and acceptance gates are satisfied.
- Failed or revision-required moves remain the active move.
- The router never invents a move or expands scope.
- Authorization does not imply approval, merge, deployment, or acceptance.
- The trajectory carries direction; authorization carries authority.
- Merge evidence does not substitute for ACCEPT.json completion evidence.
- One active move at a time; every move stops at human review.
- Human sovereignty remains external to the recursive engineering loop.
