name: Lab Remote Redaction Boundary

# `tests/test_lab_remote_redaction.py` pins the shared-substrate repair: a git
# remote's `user:token@` userinfo must never be surfaced by
# `lab/observatory/git.py::repository_state()` (and therefore never by
# `GET /api/lab/overview`, which returns `lab.service.build_overview()`).
#
# That guard must actually execute. The only broad-suite step that touches the
# CP10 workflow (`sg-02-fe-2-v.yml` `CP10-B broader backend regression`) is
# `continue-on-error: true` and runs a bare `pytest tests/ -q`, which aborts at
# the CE-01 `weaver.autonomy` collection error - so it executes none of the Lab
# guards. A dedicated judging step is what makes this one bite, and
# `tests/test_lab_remote_redaction_ci_wiring.py` proves it stays that way.
#
# The guard's own domain is narrow and named: the producer (`lab/observatory/**`,
# `lab/service.py`), the endpoint wiring (`api/lab_routes.py`), the guard itself,
# and this workflow. A change to any of those must run the guard that judges it.
on:
  pull_request:
    paths:
      - ".github/workflows/lab-remote-redaction.yml"
      - "lab/observatory/**"
      - "lab/service.py"
      - "api/lab_routes.py"
      - "tests/test_lab_remote_redaction.py"
      - "tests/test_lab_remote_redaction_ci_wiring.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-remote-redaction.yml"
      - "lab/observatory/**"
      - "lab/service.py"
      - "api/lab_routes.py"
      - "tests/test_lab_remote_redaction.py"
      - "tests/test_lab_remote_redaction_ci_wiring.py"
  workflow_dispatch:

jobs:
  lab-remote-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest pyyaml
      - name: Lab remote redaction boundary
        # Judging (no `continue-on-error`): a step that cannot fail enforces
        # nothing. The producer uses only the standard library, so this job needs
        # no application dependency and cannot misreport a dependency gap as a
        # redaction regression.
        run: |
          python -m pytest \
            tests/test_lab_remote_redaction.py \
            tests/test_lab_remote_redaction_ci_wiring.py \
            -q
