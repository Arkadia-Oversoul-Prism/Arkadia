name: SolSpire R4 run orchestration

on:
  push:
    branches:
      - 'recon/solspire-r0'
    paths:
      - 'solspire/console_router.py'
      - 'tests/test_solspire_r4_run_orchestration.py'
      - 'docs/architecture/SOLSPIRE_RECONCILIATION_R4.md'
      - '.github/workflows/solspire-r4-validation.yml'
  workflow_dispatch:

jobs:
  r4-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q tests/test_solspire_r4_run_orchestration.py
