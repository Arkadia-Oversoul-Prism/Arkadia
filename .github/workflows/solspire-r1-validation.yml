name: SolSpire R1 governance convergence

on:
  push:
    branches:
      - 'recon/solspire-r0'
    paths:
      - 'solspire/project_execution.py'
      - 'weaver/governance.py'
      - 'weaver/execution.py'
      - 'weaver/pass_spec.py'
      - 'tests/test_solspire_r1_governance_convergence.py'
      - '.github/workflows/solspire-r1-validation.yml'
  workflow_dispatch:

jobs:
  r1-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q tests/test_solspire_r1_governance_convergence.py tests/test_weaver_mvp2_exec_binding.py
