name: Oracle transport finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'oracle transport closure result') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate remaining frontend Oracle transports
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('web/public_prism/src')

          def edit(path, fn):
              p = root / path
              text = p.read_text(encoding='utf-8')
              new = fn(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  print('updated', p)

          def add_import(text, statement):
              return text if statement in text else statement + '\n' + text

          # Native Response semantics remain intentional; apiFetch owns base URL/auth.
          def account(text):
              text = text.replace("import { API_BASE } from '../lib/apiConfig';\n", '')
              text = add_import(text, "import { apiFetch } from '../lib/apiClient';")
              text = text.replace("fetch(`${API_BASE.replace(/\\/$/,'')}/api/me`", "apiFetch('/api/me'")
              return text

          def master(text):
              text = text.replace("import { API_BASE } from '../lib/apiConfig';\n", '')
              text = add_import(text, "import { apiFetch } from '../lib/apiClient';")
              text = text.replace("fetch(`${API_BASE.replace(/\\/$/, '')}/api/me/identity-spine`", "apiFetch('/api/me/identity-spine'")
              return text

          def living(text):
              text = text.replace("import { API_BASE } from '../lib/apiConfig';\n", '')
              text = add_import(text, "import { apiFetch } from '../lib/apiClient';")
              text = re.sub(r"const AIS_PROFILE_URL = `\$\{API_BASE\}/api/me/ais-profile`;", "const AIS_PROFILE_PATH = '/api/me/ais-profile';", text)
              text = text.replace('fetch(AIS_PROFILE_URL', 'apiFetch(AIS_PROFILE_PATH')
              return text

          def node(text):
              text = text.replace("import { API_BASE } from '../lib/apiConfig';\n", '')
              text = add_import(text, "import { apiFetch } from '../lib/apiClient';")
              text = re.sub(r"const AIS_URL = `\$\{API_BASE\.replace\(/\\\/$/,'\'\)\}/api/me/ais-profile`;", "const AIS_PROFILE_PATH = '/api/me/ais-profile';", text)
              text = text.replace('fetch(AIS_URL', 'apiFetch(AIS_PROFILE_PATH')
              return text

          def dashboard_codex(text):
              text = text.replace("import { API_BASE as API_BASE_CONFIG } from '../../lib/apiConfig';\n", '')
              text = add_import(text, "import { apiFetch } from '../../lib/apiClient';")
              text = re.sub(r"\nconst BASE = \(API_BASE_CONFIG \?\? \"\"\)\.replace\(/\\\/$/, \"\"\)\n", '\n', text)
              text = text.replace('fetch(`${BASE}/api/codex/upload`', 'apiFetch(`/api/codex/upload`')
              return text

          def project(text):
              text = text.replace("import { API_BASE as API_BASE_CONFIG } from '../lib/apiConfig';\n", '')
              return text

          def personal_upload(text):
              # apiFetch already owns bearer propagation. Keep FormData untouched.
              text = re.sub(r"\n\s*const headers: Record<string, string> = \{\};\n\s*if \(user\?\.idToken\) headers\['Authorization'\] = `Bearer \$\{user\.idToken\}`;", '', text)
              text = text.replace('body: fd, headers', 'body: fd')
              return text

          edit(Path('pages/AccountPage.tsx').relative_to(''), account)
          edit(Path('pages/MasterProfile.tsx').relative_to(''), master)
          edit(Path('pages/LivingGate.tsx').relative_to(''), living)
          edit(Path('pages/NodeEntry.tsx').relative_to(''), node)
          edit(Path('pages/dashboard/DashboardCodex.tsx').relative_to(''), dashboard_codex)
          edit(Path('pages/ProjectDashboard.tsx').relative_to(''), project)
          edit(Path('components/PersonalUploadZone.tsx').relative_to(''), personal_upload)

      - name: Validate Oracle boundary closure
        shell: bash
        run: |
          set -e
          echo '--- frontend API base/token/auth references ---'
          grep -RIn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env\.VITE_API_URL|import\.meta\.env\.VITE_API_BASE_URL|http://localhost:8000|http://127\.0\.0\.1:8000|localStorage\.getItem\(["'"']arkadia_token["'"']\)|localStorage\.setItem\(["'"']arkadia_token["'"']\)|localStorage\.removeItem\(["'"']arkadia_token["'"']\)|Authorization[[:space:]]*:' web/public_prism/src --exclude='apiClient.ts' || true
          echo '--- raw frontend Oracle fetches ---'
          grep -RIn --include='*.ts' --include='*.tsx' -E 'fetch\([^\n]*(/api/|/solspire/|AIS_PROFILE_PATH|AIS_URL|API_BASE|API_BASE_CONFIG|ORACLE|BASE)' web/public_prism/src --exclude='apiClient.ts' || true
          if grep -RIn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env\.VITE_API_URL|import\.meta\.env\.VITE_API_BASE_URL|http://localhost:8000|http://127\.0\.0\.1:8000' web/public_prism/src --exclude='apiClient.ts' --exclude='apiConfig.ts'; then exit 1; fi
          if grep -RIn --include='*.ts' --include='*.tsx' -E "localStorage\.getItem\(['\"]arkadia_token['\"]\)|localStorage\.setItem\(['\"]arkadia_token['\"]\)|localStorage\.removeItem\(['\"]arkadia_token['\"]\)|Authorization[[:space:]]*:.*Bearer" web/public_prism/src --exclude='apiClient.ts'; then exit 1; fi
          if grep -RIn --include='*.ts' --include='*.tsx' -E 'fetch\([^\n]*(/api/|/solspire/|AIS_PROFILE_PATH|AIS_URL|API_BASE|API_BASE_CONFIG|ORACLE|BASE)' web/public_prism/src --exclude='apiClient.ts'; then exit 1; fi
      - name: Build frontend
        working-directory: web/public_prism
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Remove finalize workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/_oracle_transport_finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: oracle transport closure result'
          git push origin main
