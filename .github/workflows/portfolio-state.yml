name: Portfolio State

# Executes the hourly portfolio ledger guard. The directive
# (docs/control-plane/openhands/hourly-weaver/2026-11-21-weekly-closure-directive.md)
# makes the Hourly Weaver a three-repository worker and requires a durable
# ledger plus a deterministic "oldest verified last_progress_at" selection.
# Nothing executed either before this workflow: every pulse re-derived state
# from a fresh sandbox and no record survived, so a stalled repository could be
# starved with no artefact showing it.
#
# Scope note, recorded rather than papered over: this gate runs the *offline*
# guard (structure, arithmetic, fairness). The live oracle
# (scripts/portfolio_state_refresh.py) needs a token that can read all three
# repositories; a repository-scoped GITHUB_TOKEN cannot, so wiring it here
# would produce a permanently red step that proves nothing. Refreshing the
# ledger stays an operator command, and the ledger records its own derived_at
# so staleness is visible in review.
on:
  pull_request:
    paths:
      - "docs/control-plane/openhands/hourly-weaver/**"
      - "scripts/portfolio_state.py"
      - "scripts/portfolio_state_refresh.py"
      - "tests/test_portfolio_state_ledger.py"
      - ".github/workflows/portfolio-state.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/control-plane/openhands/hourly-weaver/**"
      - "scripts/portfolio_state.py"
      - "scripts/portfolio_state_refresh.py"
      - "tests/test_portfolio_state_ledger.py"
      - ".github/workflows/portfolio-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pyyaml
      - name: Execute the portfolio ledger guard
        run: python -m pytest -q tests/test_portfolio_state_ledger.py
      - name: Execute the guard as the gate executes it
        # The committed artefacts must support their own recorded selection.
        run: python scripts/portfolio_state.py --check
