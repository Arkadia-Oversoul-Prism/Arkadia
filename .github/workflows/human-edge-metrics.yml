name: Human Edge codebase metrics (temporary audit)

on:
  push:
    branches:
      - audit/human-edge-metrics-2026-10-27

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical Arkadia main revision under assessment
        uses: actions/checkout@v4
        with:
          repository: Arkadia-Oversoul-Prism/Arkadia
          ref: 36f53be22d753ffe269f05cbf3fb39212f744207
          path: source
          fetch-depth: 0

      - name: Set up Go for scc
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install pinned scc
        run: |
          go install github.com/boyter/scc/v3@v3.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          scc --version

      - name: Record exact source revision and inventory
        shell: bash
        run: |
          set -euo pipefail
          cd source
          printf 'candidate_repository=Arkadia-Oversoul-Prism/Arkadia\n' > ../candidate-revision.txt
          printf 'candidate_ref=main\n' >> ../candidate-revision.txt
          printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)" >> ../candidate-revision.txt
          printf 'candidate_commit_date=%s\n' "$(git show -s --format=%cI HEAD)" >> ../candidate-revision.txt
          printf 'visibility=public\n' >> ../candidate-revision.txt
          printf 'tracked_files=%s\n' "$(git ls-files | wc -l | tr -d ' ')" >> ../candidate-revision.txt
          printf 'tracked_bytes=%s\n' "$(git ls-files -z | xargs -0 -r stat -c '%s' | awk '{s+=$1} END {printf "%.0f",s}')" >> ../candidate-revision.txt
          printf '\nTop-level tracked paths:\n' >> ../candidate-revision.txt
          git ls-tree --name-only HEAD >> ../candidate-revision.txt
          printf '\nFile extension inventory:\n' > ../file-extension-inventory.txt
          git ls-files | awk -F. 'NF>1 {print tolower($NF)}' | sort | uniq -c | sort -nr >> ../file-extension-inventory.txt
          printf '\nBuild/test configuration files:\n' >> ../candidate-revision.txt
          git ls-files | grep -Ei '(^|/)(package\.json|pnpm-lock\.yaml|pyproject\.toml|pytest\.ini|tox\.ini|Dockerfile|docker-compose[^/]*|vercel\.json|railway\.json|render\.yaml|requirements[^/]*|Makefile|build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradlew|pom\.xml|Cargo\.toml|go\.mod|tsconfig[^/]*\.json|vitest\.config\.[^/]+|jest\.config\.[^/]+)$' >> ../candidate-revision.txt || true
          git ls-files | grep -Ei '(^|/)(tests?|__tests__)/|(^|/)[^/]+\.(test|spec)\.[^/]+$' | sort > ../test-file-inventory.txt || true
          git log -1 --format='%H%n%cs%n%s' > ../head-commit-metadata.txt

      - name: Run Human Edge scc reports
        shell: bash
        run: |
          set -euo pipefail
          cd source
          scc -x csv --exclude-dir .git,.hg,.svn,vendor,node_modules,dist,build,generated,migrations,Migrations --format json -o ../scc-report.json .
          scc -x csv --exclude-dir .git,.hg,.svn,vendor,node_modules,dist,build,generated,migrations,Migrations . > ../scc-summary.txt
          scc -x csv --gen --generated-markers "do not edit,<auto-generated />,<auto-generated>" --exclude-dir .git,.hg,.svn,vendor,node_modules,dist,build,generated,migrations,Migrations . > ../scc-generated.txt
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('../scc-report.json').read_text())
          Path('../scc-json-validation.txt').write_text(
              'valid_json=true\n'
              f'top_level_type={type(data).__name__}\n'
              f'top_level_keys={list(data.keys()) if isinstance(data,dict) else "not-object"}\n'
          )
          PY

      - name: Run prescribed jscpd duplication report
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npx --yes jscpd@4.0.5 . --min-tokens 50 --min-lines 5 --reporters json --ignore "**/*.csv" --ignore "**/.git/**" --output ../jscpd-output
          cd ..
          report="$(find jscpd-output -type f -name '*.json' -print -quit)"
          test -n "$report"
          cp "$report" jscpd-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('jscpd-report.json').read_text())
          Path('jscpd-json-validation.txt').write_text(
              'valid_json=true\n'
              f'top_level_type={type(data).__name__}\n'
              f'top_level_keys={list(data.keys()) if isinstance(data,dict) else "not-object"}\n'
          )
          PY

      - name: Run prescribed non-merge, non-revert commit count
        shell: bash
        run: |
          set -euo pipefail
          cd source
          count="$(git log --oneline --no-merges | grep -v -i revert | wc -l | tr -d ' ')"
          printf '%s\n' "$count" > ../non-merge-non-revert-commit-count.txt
          printf 'command=git log --oneline --no-merges | grep -v -i revert | wc -l\n' > ../commit-count-method.txt
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> ../commit-count-method.txt
          printf 'count=%s\n' "$count" >> ../commit-count-method.txt

      - name: Upload metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: arkadia-human-edge-metrics-36f53be
          path: |
            candidate-revision.txt
            file-extension-inventory.txt
            test-file-inventory.txt
            head-commit-metadata.txt
            scc-report.json
            scc-summary.txt
            scc-generated.txt
            scc-json-validation.txt
            jscpd-report.json
            jscpd-json-validation.txt
            jscpd-output/**
            non-merge-non-revert-commit-count.txt
            commit-count-method.txt
          if-no-files-found: error
          retention-days: 7
