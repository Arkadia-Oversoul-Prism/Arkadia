name: Oracle boundary closure codemod

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  close-boundary:
    if: ${{ !contains(github.event.head_commit.message, 'oracle boundary closure codemod result') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded codemod
        run: python scripts/oracle_boundary_closure.py

      - name: Validate static closure
        run: |
          set -e
          echo '--- direct frontend environment resolution ---'
          grep -RIn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env\.VITE_API_URL|import\.meta\.env\.VITE_API_BASE_URL|http://localhost:8000|http://127\.0\.0\.1:8000' web/public_prism/src || true
          echo '--- consumer-owned auth transport ---'
          grep -RIn --include='*.ts' --include='*.tsx' -E "localStorage\.getItem\(['\"]arkadia_token['\"]\)|localStorage\.setItem\(['\"]arkadia_token['\"]\)|localStorage\.removeItem\(['\"]arkadia_token['\"]\)|Authorization:" web/public_prism/src || true
          if grep -RIn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env\.VITE_API_URL|import\.meta\.env\.VITE_API_BASE_URL|http://localhost:8000|http://127\.0\.0\.1:8000' web/public_prism/src --exclude='apiConfig.ts'; then exit 1; fi
          if grep -RIn --include='*.ts' --include='*.tsx' -E "localStorage\.getItem\(['\"]arkadia_token['\"]\)|localStorage\.setItem\(['\"]arkadia_token['\"]\)|localStorage\.removeItem\(['\"]arkadia_token['\"]\)|Authorization:" web/public_prism/src --exclude='apiClient.ts'; then exit 1; fi
          if grep -RIn --include='*.ts' --include='*.tsx' -E 'fetch\([[:space:]]*([`\"'"'"']/(api|solspire|oracle|status)|`\$\{(API_BASE|ORACLE|base|execBase)\})' web/public_prism/src --exclude='apiClient.ts'; then exit 1; fi

      - name: Build frontend
        working-directory: web/public_prism
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit and push closure result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oracle-boundary-closure.yml scripts/oracle_boundary_closure.py
          git add -A
          git commit -m 'fix: oracle boundary closure codemod result'
          git push origin main
