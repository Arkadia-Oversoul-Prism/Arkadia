name: _verify_restored_prism
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_verify_restored_prism.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/public_prism/pnpm-lock.yaml
      - name: Install
        working-directory: web/public_prism
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web/public_prism
        run: pnpm build
      - name: Assert restored surfaces
        run: |
          test -f web/public_prism/src/components/solspire/ProjectsWorkspace.tsx
          test -f web/public_prism/src/components/solspire/ProjectKnowledgeGraph.tsx
          grep -q "initialTab={projectTab}" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "WorkspaceCollection kind=\"memory\"" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "WorkspaceCollection kind=\"events\"" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "spiral-codex" web/public_prism/src/App.tsx
          grep -q "encyclopedia" web/public_prism/src/App.tsx
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_verify_restored_prism.yml
          git commit -m 'chore: remove temporary Prism verification workflow'
          git push