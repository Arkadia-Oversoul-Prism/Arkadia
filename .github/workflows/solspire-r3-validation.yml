name: SolSpire R3 ExecutionRuntime boundary

on:
  push:
    branches:
      - 'recon/solspire-r0'
    paths:
      - 'solspire/execution_runtime.py'
      - 'solspire/planner.py'
      - 'tests/test_solspire_r3_execution_runtime.py'
      - 'docs/architecture/SOLSPIRE_RECONCILIATION_R3.md'
      - '.github/workflows/solspire-r3-validation.yml'
  workflow_dispatch:

jobs:
  r3-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q tests/test_solspire_r3_execution_runtime.py
