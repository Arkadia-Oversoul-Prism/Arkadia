name: Lab Security Contract

on:
  pull_request:
    paths:
      - "lab/observatory/git.py"
      - "lab/service.py"
      - "api/lab_routes.py"
      - "tests/test_repository_remote_redaction.py"
      - ".github/workflows/lab-security-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "lab/observatory/git.py"
      - "lab/service.py"
      - "api/lab_routes.py"
      - "tests/test_repository_remote_redaction.py"
      - ".github/workflows/lab-security-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Execute remote-redaction contract
        run: python -m pytest -q tests/test_repository_remote_redaction.py
