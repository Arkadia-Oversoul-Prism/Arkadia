name: _functional_ui_verify
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/public_prism/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Frontend build
        working-directory: web/public_prism
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Route and surface regression checks
        shell: bash
        run: |
          grep -q "projects" web/public_prism/src/App.tsx
          grep -q "'/encyclopedia': 'encyclopedia'" web/public_prism/src/App.tsx
          grep -q "'/spiral-codex': 'spiral-codex'" web/public_prism/src/App.tsx
          grep -q "ProjectsWorkspace" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "FilesWorkspace" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "ConversationsWorkspace" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "TasksWorkspace" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "/solspire/projects/.*files/upload" web/public_prism/src/components/solspire/WorkspaceActionSurfaces.tsx
          grep -q "/solspire/projects/.*/conversations/.*/messages" web/public_prism/src/components/solspire/WorkspaceActionSurfaces.tsx
          grep -q "/solspire/projects/.*/tasks/.*/" web/public_prism/src/components/solspire/WorkspaceActionSurfaces.tsx
      - name: Remove temporary verification workflow
        shell: bash
        run: |
          rm .github/workflows/_functional_ui_verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_functional_ui_verify.yml
          git commit -m "chore: remove temporary functional UI verification" || exit 0
          git push
