name: _wire_weaver_workspace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_wire_weaver_workspace.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Weaver project entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/public_prism/src/components/solspire/SolSpireExperience.tsx')
          s = p.read_text()
          s = s.replace(
              "function LensContent({section,onOpenProject}:{section:SolSpireLens;onOpenProject:(p:Project)=>void})",
              "function LensContent({section,onOpenProject,onOpenWeaver}:{section:SolSpireLens;onOpenProject:(p:Project)=>void;onOpenWeaver:(p:Project)=>void})"
          )
          s = s.replace(
              "if(section==='weaver')return <WeaverSummary onOpenProject={onOpenProject}/>;",
              "if(section==='weaver')return <WeaverSummary onOpenProject={onOpenWeaver}/>;"
          )
          s = s.replace(
              "const [section,setSection]=useState<SolSpireLens>(initialSection); const [project,setProject]=useState<Project|null>(null);",
              "const [section,setSection]=useState<SolSpireLens>(initialSection); const [project,setProject]=useState<Project|null>(null); const [projectTab,setProjectTab]=useState<'overview'|'weaver'>('overview');"
          )
          s = s.replace(
              "const selectSection=(next:SolSpireLens)=>{setSection(next);setProject(null);setMore(false);",
              "const selectSection=(next:SolSpireLens)=>{setSection(next);setProject(null);setProjectTab('overview');setMore(false);"
          )
          s = s.replace(
              "if(project)return <div className=\"solspire-workspace\">",
              "const openProject=(p:Project)=>{setProject(p);setProjectTab('overview');}; const openWeaver=(p:Project)=>{setProject(p);setProjectTab('weaver');};\n  if(project)return <div className=\"solspire-workspace\">"
          )
          s = s.replace(
              "<ProjectDashboard project={project} onBack={()=>setProject(null)} onProjectUpdated={setProject}/>",
              "<ProjectDashboard project={project} initialTab={projectTab} onBack={()=>{setProject(null);setProjectTab('overview')}} onProjectUpdated={setProject}/>",
              1
          )
          s = s.replace(
              "<LensContent section={section} onOpenProject={p=>setProject(p)}/>",
              "<LensContent section={section} onOpenProject={openProject} onOpenWeaver={openWeaver}/>",
              1
          )
          p.write_text(s)
          PY
      - name: Verify source wiring
        run: |
          grep -q "initialTab={projectTab}" web/public_prism/src/components/solspire/SolSpireExperience.tsx
          grep -q "onOpenWeaver" web/public_prism/src/components/solspire/SolSpireExperience.tsx
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public_prism/src/components/solspire/SolSpireExperience.tsx
          git commit -m 'ui: open Weaver directly in project workbench'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_wire_weaver_workspace.yml
          git commit -m 'chore: remove temporary Weaver wiring workflow'
          git push