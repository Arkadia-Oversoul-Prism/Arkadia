name: Auth transport finalize 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'auth transport closure result 2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove secondary Knowledge auth owner
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('web/public_prism/src')
          p = root / 'lib/knowledgeApi.ts'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r"/\*\* Optional Bearer token for user-scoped Knowledge OS reads/writes\. \*/\s*let _authToken: string \| null = null;\s*export function setKnowledgeAuthToken\(token: string \| null\) \{\s*_authToken = token;\s*\}\s*", '', text)
          text = re.sub(r"\s*if \(_authToken && !headers\['Authorization'\]\) \{\s*headers\['Authorization'\] = `Bearer \$\{_authToken\}`;\s*\}", '', text)
          p.write_text(text, encoding='utf-8')
          for rel in ['pages/PersonalEchofeild.tsx', 'components/solspire/SolSpireExperience.tsx']:
              p = root / rel
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'\s*setKnowledgeAuthToken\([^;]*\);?', '', text)
              text = re.sub(r',\s*setKnowledgeAuthToken(?=\s*[,}])', '', text)
              text = text.replace('setKnowledgeAuthToken,', '')
              p.write_text(text, encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -e
          ! grep -RIn --include='*.ts' --include='*.tsx' 'setKnowledgeAuthToken' web/public_prism/src
          ! grep -RIn --include='*.ts' --include='*.tsx' '_authToken' web/public_prism/src/lib/knowledgeApi.ts
          ! grep -RIn --include='*.ts' --include='*.tsx' -E 'Authorization[[:space:]]*:[[:space:]]*[^/]*Bearer' web/public_prism/src --exclude='apiClient.ts'
          ! grep -RIn --include='*.ts' --include='*.tsx' -E "localStorage\.(getItem|setItem|removeItem)\(['\"]arkadia_token['\"]\)" web/public_prism/src --exclude='apiClient.ts'
      - name: Build frontend
        working-directory: web/public_prism
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/_auth_transport_finalize.yml .github/workflows/_auth_transport_finalize2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: auth transport closure result 2'
          git push origin main
