name: CI Verdict Step Integrity

# `tests/test_ci_verdict_step_integrity.py` asserts that a CI verdict step can
# actually report failure: every `steps.<id>.outcome` reference resolves, and no
# enforced verdict step destroys its own exit status by piping into `tee`
# without `pipefail`. Its domain is the whole workflow corpus.
#
# The source shape is `main` @ `850216fc`: `sg-02-fe-2-v.yml` prints
# `Grove contracts: ${{ steps.grove.outcome }}` while the step declares no `id`.
# The runtime log is run `38150620847` (`event=push`, head `56ada9dd`), whose
# `sg-02-fe-2-v.yml` is byte-identical to `main`'s and which is a `main`
# ancestor. There the substituted line is `echo "Grove contracts: "` — the value
# was empty — while in the same run the `lab` step printed `2 failed, 9 passed`
# and the terminal enforcement still printed `test 'success' = success` for all
# 16 assertions. A guard that cannot fail is decoration; this workflow is the
# executable surface for the guard that keeps CI verdicts able to fail.
#
# The guard is a pure-source check: it parses `.github/workflows/*.yml` and needs
# no application dependency beyond pytest and pyyaml. The `paths` filters name
# the guard, its own workflow, and `.github/workflows/**`, because the guard's
# domain is every workflow file — a change to any of them is a change to what the
# guard asserts. The two filters are kept identical:
# `tests/test_ci_gate_trigger_coverage.py` fails an asymmetric pair, and
# `tests/test_ci_verdict_step_integrity.py` fails a masked enforced verdict step.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/test_ci_verdict_step_integrity.py"
      - "tests/test_ci_verdict_step_integrity_ci_wiring.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/test_ci_verdict_step_integrity.py"
      - "tests/test_ci_verdict_step_integrity_ci_wiring.py"
  workflow_dispatch:

jobs:
  verdict-step-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest pyyaml
      - name: Verdict step integrity guards
        run: |
          python -m pytest tests/test_ci_verdict_step_integrity.py tests/test_ci_verdict_step_integrity_ci_wiring.py -q
