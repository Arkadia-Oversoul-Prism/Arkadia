name: economic-seam-engine

on:
  pull_request:
    paths:
      - 'economic_seams/**'
      - 'api/economic_seam_routes.py'
      - 'tests/test_economic_seam_engine.py'
      - 'tests/test_economic_seam_correlation.py'
      - 'tests/test_nocopo_adapter.py'
      - 'tests/test_market_data.py'
      - 'tests/test_source_adapters_and_sqlite.py'
      - 'economic_seams/deal_sheet.py'
      - 'tests/test_deal_sheet.py'
      - '.github/workflows/economic-seam-engine.yml'
  push:
    branches: [main]
    paths:
      - 'economic_seams/**'
      - 'api/economic_seam_routes.py'
      - 'tests/test_economic_seam_engine.py'
      - 'tests/test_economic_seam_correlation.py'
      - 'tests/test_nocopo_adapter.py'
      - 'tests/test_market_data.py'
      - 'economic_seams/deal_sheet.py'
      - 'tests/test_deal_sheet.py'
      - '.github/workflows/economic-seam-engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_seam_engine.py tests/test_economic_seam_correlation.py tests/test_nocopo_adapter.py tests/test_market_data.py tests/test_deal_sheet.py tests/test_source_adapters_and_sqlite.py
