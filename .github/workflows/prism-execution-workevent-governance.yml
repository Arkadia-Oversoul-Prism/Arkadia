name: Prism Execution-WorkEvent Governance

on:
  pull_request:
    paths:
      - "weaver/enterprise_orchestration.py"
      - "weaver/execution_workevent_bridge.py"
      - "solspire/workevent_manager.py"
      - "tests/test_prism_execution_workevent_governance.py"
      - "tests/test_execution_workevent_boundary.py"
      - "tests/test_workevent_evidence_boundary.py"
      - "tests/test_authority_boundary.py"
      - "tests/test_evidence_verification_boundary.py"
      - "tests/test_authority_api_enterprise_boundary.py"
      - ".github/workflows/prism-execution-workevent-governance.yml"
  push:
    branches:
      - "feat/prism-execution-workevent-governance"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-asyncio
      - name: Governance and causal-bridge tests
        run: |
          python -m pytest -q \
            tests/test_prism_execution_workevent_governance.py \
            tests/test_execution_workevent_boundary.py
      - name: Existing WorkEvent and Weaver authorization regressions
        if: always()
        run: |
          python -m pytest -q \
            tests/test_workevent_evidence_boundary.py \
            tests/test_authority_boundary.py \
            tests/test_evidence_verification_boundary.py \
            tests/test_authority_api_enterprise_boundary.py
