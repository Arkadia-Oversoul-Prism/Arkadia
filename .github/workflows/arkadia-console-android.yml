name: Arkadia Console Android
on:
  pull_request:
    paths:
      - "arkadia-console-android/**"
      - ".github/workflows/arkadia-console-android.yml"
  push:
    branches: [main]
    paths:
      - "arkadia-console-android/**"
      - ".github/workflows/arkadia-console-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arkadia-console-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arkadia-console-debug-apk
          path: arkadia-console-android/app/build/outputs/apk/debug/*.apk
