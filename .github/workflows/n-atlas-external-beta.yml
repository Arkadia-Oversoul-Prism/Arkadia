name: N-ATLAS external beta validation
# CI retrigger marker: 2026-10-07T22:37+01:00

on:
  push:
    branches: [feat/n-atlas-developer-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  beta:
    name: beta-${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: beta-01-english
            language: English
            prompt: "Respond briefly: What is the purpose of evidence in a governed AI workflow?"
          - id: beta-02-hausa
            language: Hausa
            prompt: "Amsa a takaice da Hausa: Me ya sa hujja take da muhimmanci a tsarin AI mai mulki?"
    steps:
      - uses: actions/checkout@v4

      - name: Discover EDNAi Space interface
        env:
          SPACE: KoladeOdunope/ednai-natlas-runtime
        run: |
          python - <<'PY'
          import json, requests
          base='https://huggingface.co'
          space='KoladeOdunope/ednai-natlas-runtime'
          for url in [f'{base}/api/spaces/{space}', f'{base}/api/spaces/{space}/tree/main', f'{base}/spaces/{space}/raw/main/README.md', f'{base}/spaces/{space}/raw/main/app.py']:
            print('\n===',url,'===')
            r=requests.get(url,timeout=30); print('HTTP',r.status_code); print(r.text[:20000])
          PY
      - name: Install validation dependencies
        run: python -m pip install --quiet requests

      - name: Run external N-ATLAS inference and build evidence
        env:
          SPACE: KoladeOdunope/ednai-natlas-runtime
          PROMPT: ${{ matrix.prompt }}
          LANGUAGE: ${{ matrix.language }}
          BETA_ID: ${{ matrix.id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, time
          from datetime import datetime, timezone
          import requests

          base = "https://koladeodunope-ednai-natlas-runtime.hf.space"
          prompt = os.environ["PROMPT"]
          language = os.environ["LANGUAGE"]
          beta_id = os.environ["BETA_ID"]

          def sha(s):
              return hashlib.sha256(s.encode("utf-8")).hexdigest()

          def now():
              return datetime.now(timezone.utc).isoformat()

          events = []
          events.append({"event":"RUN_STARTED","timestamp":now(),"beta_id":beta_id})

          response_text = ""
          endpoint_used = None
          raw = None
          errors = []

          # The public EDNAi runtime is documented as a simple messages-in/reply-out
          # service. Discover its exposed contract first, then try conservative JSON
          # shapes without treating any failed probe as successful inference.
          for path in ["/openapi.json", "/api/openapi.json"]:
              try:
                  r = requests.get(base + path, timeout=20)
                  if r.ok:
                      try:
                          raw = r.json()
                          break
                      except Exception:
                          pass
              except Exception as e:
                  errors.append(f"GET {path}: {e}")

          messages_json = json.dumps([{"role":"user","content":prompt}], ensure_ascii=False)
          payload = {"data":[messages_json, 0.0, 128, False]}
          try:
              r = requests.post(base + "/gradio_api/call/generate", json=payload, timeout=30)
              if not r.ok:
                  errors.append(f"POST /gradio_api/call/generate: HTTP {r.status_code} {r.text[:500]}")
              else:
                  event_id = r.json().get("event_id")
                  if not event_id:
                      errors.append(f"POST /gradio_api/call/generate: missing event_id: {r.text[:500]}")
                  else:
                      endpoint_used = "/gradio_api/call/generate"
                      deadline = time.time() + 240
                      with requests.get(base + "/gradio_api/call/generate/" + event_id, stream=True, timeout=270) as stream:
                          stream.raise_for_status()
                          for line in stream.iter_lines(decode_unicode=True):
                              if time.time() > deadline:
                                  errors.append("GET /gradio_api/call/generate/{event_id}: timeout")
                                  break
                              if not line or not line.startswith("data: "):
                                  continue
                              data_text = line[6:]
                              if data_text == "[DONE]":
                                  break
                              try:
                                  data = json.loads(data_text)
                              except json.JSONDecodeError:
                                  continue
                              if isinstance(data, list) and data:
                                  value = data[0]
                                  if isinstance(value, str):
                                      try:
                                          parsed = json.loads(value)
                                          if isinstance(parsed, dict):
                                              response_text = str(parsed.get("text","")).strip()
                                              raw = parsed
                                          else:
                                              response_text = value.strip()
                                              raw = value
                                      except json.JSONDecodeError:
                                          response_text = value.strip()
                                          raw = value
                                  elif isinstance(value, dict):
                                      response_text = str(value.get("text") or value.get("response") or value.get("output") or "").strip()
                                      raw = value
                              if response_text:
                                  break
          except Exception as e:
              errors.append(f"Gradio generate: {e}")

          if not response_text:
              events.append({"event":"RUN_FAILED","timestamp":now(),"reason":"external runtime did not return usable inference","errors":errors[-10:]})
              evidence = {
                  "schema":"ARKADIA-NATLAS-EVIDENCE-001",
                  "status":"FAILED",
                  "beta_id":beta_id,
                  "language":language,
                  "runtime":base,
                  "model":"N-ATLaS",
                  "prompt_sha256":sha(prompt),
                  "git_sha":os.environ["GIT_SHA"],
                  "events":events,
                  "errors":errors[-20:],
              }
              os.makedirs("evidence", exist_ok=True)
              with open(f"evidence/{beta_id}.json","w") as f: json.dump(evidence,f,indent=2,ensure_ascii=False)
              print(json.dumps(evidence,indent=2,ensure_ascii=False))
              sys.exit(1)

          events.append({"event":"MODEL_TURN","timestamp":now(),"provider":"external-space","model":"N-ATLaS","endpoint":endpoint_used})
          evaluation = {"name":"non_empty_response","passed":bool(response_text)}
          evidence = {
              "schema":"ARKADIA-NATLAS-EVIDENCE-001",
              "status":"PASS",
              "beta_id":beta_id,
              "language":language,
              "runtime":base,
              "endpoint":endpoint_used,
              "provider":"external-space",
              "model":"N-ATLaS",
              "prompt_sha256":sha(prompt),
              "response_sha256":sha(response_text),
              "response_chars":len(response_text),
              "evaluation":evaluation,
              "events":events + [
                  {"event":"EVIDENCE_RECORDED","timestamp":now()},
                  {"event":"RUN_FINISHED","timestamp":now()}
              ],
              "reproduction":{"git_sha":os.environ["GIT_SHA"],"prompt":prompt},
          }
          os.makedirs("evidence", exist_ok=True)
          with open(f"evidence/{beta_id}.json","w") as f: json.dump(evidence,f,indent=2,ensure_ascii=False)
          with open(f"evidence/{beta_id}.txt","w") as f: f.write(response_text + "\n")
          print(json.dumps(evidence,indent=2,ensure_ascii=False))
          print("\nN-ATLAS RESPONSE:\n" + response_text)
          PY

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-evidence
          path: evidence/

  native-golden:
    name: native-arkadia-golden-workflow
    needs: beta
    if: ${{ needs.beta.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      N_ATLAS_BASE_URL: https://koladeodunope-ednai-natlas-runtime.hf.space
      N_ATLAS_PROTOCOL: gradio
      N_ATLAS_MODEL: N-ATLaS
      N_ATLAS_LIVE_TEST: "1"
      N_ATLAS_LIVE_EVIDENCE_DIR: evidence
    steps:
      - uses: actions/checkout@v4
      - name: Install Arkadia runtime dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Execute Arkadia native N-ATLaS golden path
        run: python -m pytest -q tests/test_natlas_developer_lab.py -k native_natlas_route_live_external_gradio
      - name: Upload native golden evidence
        uses: actions/upload-artifact@v4
        with:
          name: natlas-native-golden-evidence
          path: evidence/

  bundle:
    name: bundle-beta-evidence
    needs: beta
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: "*-evidence"
          merge-multiple: true
      - name: Verify bundle shape
        run: |
          test -n "$(find evidence -type f | head -1)"
          python - <<'PY'
          import glob, json, sys
          files = glob.glob("evidence/*.json")
          print("evidence files:", files)
          statuses=[]
          for p in files:
              d=json.load(open(p))
              statuses.append(d.get("status"))
          print("statuses:", statuses)
          if len(files) != 2 or any(s != "PASS" for s in statuses):
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: natlas-ps1-external-beta-evidence-bundle
          path: evidence/
