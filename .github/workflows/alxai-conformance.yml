name: AL-XAI-04 Conformance

on:
  push:
    branches: ["feat/alxai-04-state-sync", "feat/alxai-04-reconciliation"]
  pull_request:
    paths:
      - "alxai/**"
      - "tests/conformance/**"
      - ".github/workflows/alxai-conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pydantic pytest
      - run: PYTHONPATH=. pytest -q tests/conformance/test_alxai04.py
