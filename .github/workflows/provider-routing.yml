name: Provider Routing Verification

on:
  pull_request:
    paths:
      - ".github/workflows/provider-routing.yml"
      - "weaver/**"
      - "economic_seams/**"
      - "federation/__init__.py"
      - "api/economic_seam_routes.py"
      - "tests/test_deal_sheet.py"
      - "tests/test_economic_seam_authority_boundary.py"
      - "tests/test_economic_seam_ci_wiring.py"
      - "tests/test_economic_seam_correlation.py"
      - "tests/test_economic_seam_engine.py"
      - "tests/test_m02a_ci_gate_integrity.py"
      - "tests/test_market_data.py"
      - "tests/test_nocopo_adapter.py"
      - "enterprises/eden-food-systems/enterprise.json"
      - "enterprises/eden-food-systems/tasks.seed.json"
      - "providers/**"
      - "tests/architecture/**"
      - "tests/test_weaver_k2.py"
      - "tests/test_key_pool.py"
      - "tests/test_ci_suite_collection_continuation.py"
      - "tests/test_history_depth_ci_wiring.py"
      - "conftest.py"
      # `AGENTS.md` is an *input* to a guard this job judges, not incidental prose:
      # `tests/test_agents_md_encoding_adjudication.py` reads it, so a change to it
      # alters what the guard asserts. Named by no other filter in the repository
      # (`grep -rn "AGENTS.md" .github/workflows/` matched only comments), so without
      # this line an AGENTS.md-only commit runs no whole-suite gate.
      # `tests/test_history_depth_ci_wiring.py` derives the input list from the guards'
      # own sources, so an input added there without being added here fails CI.
      - "AGENTS.md"
      - "README.md"
      - "CURRENT_STATE.md"
      - 'NEXT_AGENT.md'
      - 'PARKING_LOT.md'
      - 'ROADMAP.md'
      - "archive/frontend/arkadia-prism/web/public_prism/src/data/opportunityRadar.ts"
      - "archive/frontend/arkadia-prism/web/public_prism/src/components/EdenControlRoom.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/components/solspire/SolSpireExperience.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/components/solspire/SolSpireExperienceV2.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/pages/EnterpriseConsole.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/pages/OpportunityRadarPage.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/pages/ProjectDashboard.tsx"
      - "archive/frontend/arkadia-prism/web/public_prism/src/components/solspire/SolariunHomeCockpit.tsx"
      - ".github/workflows/sg-02-fe-2-v.yml"
      - "docs/verification/PROVIDER-ROUTING-AUDIT-BASELINE.md"
      - "docs/architecture/EDEN-OPS-02_IMPLEMENTATION.md"
      - "docs/control-plane/TRAJECTORY-ARKADIA-TRUTHFULNESS-01.yaml"
      - "docs/control-plane/WEAVER-RUN-PROTOCOL.md"
      - "docs/control-plane/moves/M02A-ci-gate-integrity.md"
      - "docs/control-plane/evidence/federation-agent-card-01/EVIDENCE.md"
      - "docs/control-plane/evidence/solariun-thread-calibration/EVIDENCE.md"
  workflow_dispatch:

jobs:
  provider-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1. This job runs the whole suite
          # (`pytest tests/`), and `tests/test_agents_md_encoding_adjudication.py`
          # resolves pinned revisions (`ORACLE_REV` 6c43218a48a4 and the corruption
          # commit) out of git history. On a shallow clone those objects are absent,
          # so `scripts/agents_md_encoding_audit.py::exit_code` returns 2 ("undecided")
          # instead of the 1 a clean file earns, and four nodes fail on a file that is
          # provably clean. Measured at main 6109c72a: a --depth 1 clone gives
          # `4 failed, 13 passed, 6 skipped` where full history gives
          # `18 passed, 5 skipped`. In this job's log those failures are
          # indistinguishable from the repository's genuine debt.
          # Guard: tests/test_history_depth_ci_wiring.py
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Targeted K2 and key-pool regressions
        run: |
          python -m pytest tests/test_weaver_k2.py tests/test_key_pool.py -q
      - name: Relevant architecture regression
        run: |
          python -m pytest tests/architecture -q
      - name: Broader test suite
        run: |
          # --continue-on-collection-errors is required, not cosmetic: the known
          # CE-01 `weaver.autonomy` module-vs-package collision aborts the whole
          # session on a bare `pytest tests/` ("Interrupted: 1 error during
          # collection"), so no test runs and every weaver/** guard silently
          # executes zero times in CI. This step's job is to judge the suite and
          # report the pre-existing debt, not to abort before reaching it.
          python -m pytest tests/ -q -rEf --continue-on-collection-errors
