name: GATE L4 Dispatch Contract

on:
  pull_request:
    paths:
      - "weaver/openhands_dispatch.py"
      - "docs/control-plane/gate-l4/**"
      - "tests/test_gate_l4_*.py"
      - ".github/workflows/gate-l4-dispatch-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate dispatch request JSON Schema syntax
        run: python -m json.tool docs/control-plane/gate-l4/OPENHANDS_DISPATCH_REQUEST.schema.json > /dev/null
      - name: Run GATE L4 security and inspection tests
        run: python -m pytest tests/test_gate_l4_dispatch_security.py tests/test_gate_l4_run_inspection.py -q
