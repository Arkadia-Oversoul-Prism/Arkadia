name: _restore_weaver_entry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_restore_weaver_entry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ProjectDashboard initial tab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/public_prism/src/pages/ProjectDashboard.tsx')
          s = p.read_text()
          s = s.replace("  onProjectUpdated: (p: Project) => void;\n}", "  onProjectUpdated: (p: Project) => void;\n  initialTab?: ProjTab;\n}")
          s = s.replace("export default function ProjectDashboard({ project, onBack, onProjectUpdated }: Props) {\n  const [tab, setTab] = useState<ProjTab>('overview');", "export default function ProjectDashboard({ project, onBack, onProjectUpdated, initialTab = 'overview' }: Props) {\n  const [tab, setTab] = useState<ProjTab>(initialTab);")
          s = s.replace("  useEffect(() => { setCurrentProject(project); }, [project]);", "  useEffect(() => { setCurrentProject(project); }, [project]);\n  useEffect(() => { setTab(initialTab); }, [initialTab, project.id]);")
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public_prism/src/pages/ProjectDashboard.tsx
          git commit -m 'ui: support contextual project dashboard entry tabs'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/_restore_weaver_entry.yml
          git commit -m 'chore: remove temporary Weaver entry workflow'
          git push