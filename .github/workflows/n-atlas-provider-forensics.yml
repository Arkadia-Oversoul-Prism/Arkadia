name: N-ATLAS provider forensics

on:
  push:
    branches: [chore/natlas-provider-forensics]
  workflow_dispatch:

jobs:
  provider-forensics:
    runs-on: ubuntu-latest
    steps:
      - name: Install diagnostics dependency
        run: python -m pip install --quiet requests

      - name: Probe provider, capture source, runtime, SSE, and logs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import requests

          space = "KoladeOdunope/ednai-natlas-runtime"
          base = "https://huggingface.co"
          runtime = "https://koladeodunope-ednai-natlas-runtime.hf.space"
          prompt = 'Rewrite this message in natural Nigerian English while keeping it professional: "Please send the document as soon as possible because we need to review it before the meeting."'
          out = Path("provider-forensics")
          out.mkdir()

          session = requests.Session()
          token = os.getenv("HF_TOKEN", "").strip()
          headers = {"Authorization": f"Bearer {token}"} if token else {}

          def write(name, value):
              (out / name).write_text(value, encoding="utf-8")

          # Public Space metadata and source.
          for name, url in [
              ("space-metadata.json", f"{base}/api/spaces/{space}"),
              ("space-tree.json", f"{base}/api/spaces/{space}/tree/main"),
              ("app.py", f"{base}/spaces/{space}/raw/main/app.py"),
              ("README.md", f"{base}/spaces/{space}/raw/main/README.md"),
          ]:
              r = session.get(url, timeout=30)
              if name.endswith(".json"):
                  try:
                      write(name, json.dumps(r.json(), indent=2, ensure_ascii=False))
                  except Exception:
                      write(name, r.text)
              else:
                  write(name, r.text)
              print(name, r.status_code)

          # Provider runtime metadata.
          for name, url in [
              ("runtime-api.json", f"{base}/api/spaces/{space}"),
              ("runtime-events.txt", f"{base}/api/spaces/{space}/events?tail=100"),
              ("runtime-logs.txt", f"{base}/api/spaces/{space}/logs/run?tail=300"),
          ]:
              r = session.get(url, headers=headers, timeout=60)
              write(name, r.text)
              print(name, r.status_code)

          # Reproduce the exact failing request and retain the complete SSE event trace.
          messages_json = json.dumps([{"role":"user","content":prompt}], ensure_ascii=False)
          payload = {"data":[messages_json, 0.0, 128, False]}
          post = session.post(runtime + "/gradio_api/call/generate", json=payload, timeout=30)
          write("request-response.txt", post.text)
          print("generate POST", post.status_code, post.text[:1000])

          trace = []
          if post.ok:
              event_id = post.json().get("event_id")
              trace.append({"phase":"submit","event_id":event_id})
              if event_id:
                  with session.get(runtime + "/gradio_api/call/generate/" + event_id,
                                   stream=True, timeout=300) as stream:
                      trace.append({"phase":"sse-http","status":stream.status_code,
                                    "headers":{"content-type":stream.headers.get("content-type")}})
                      current_event = None
                      for line in stream.iter_lines(decode_unicode=True):
                          if line is None:
                              continue
                          trace.append({"line":line})
                          if line.startswith("event:"):
                              current_event = line.split(":",1)[1].strip()
                          if current_event == "error" and line.startswith("data:"):
                              trace.append({"provider_error_event":line})
                              if line.strip() == "data: null":
                                  trace.append({"provider_error_is_null":True})
          write("sse-trace.json", json.dumps(trace, indent=2, ensure_ascii=False))

          summary = {
              "space": space,
              "space_sha": None,
              "provider_endpoint": "/gradio_api/call/generate",
              "prompt_sha256": __import__("hashlib").sha256(prompt.encode()).hexdigest(),
              "hf_token_present_for_authenticated_diagnostics": bool(token),
              "generated_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          try:
              summary["space_sha"] = session.get(f"{base}/api/spaces/{space}", timeout=30).json().get("sha")
          except Exception:
              pass
          write("summary.json", json.dumps(summary, indent=2))
          PY

      - name: Upload provider forensics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natlas-provider-forensics
          path: provider-forensics/
