name: Weaver MVP2 validation

on:
  push:
    branches: [main]
    paths:
      - 'solspire/**'
      - 'weaver/**'
      - 'web/public_prism/src/pages/ProjectDashboard.tsx'
      - 'tests/test_weaver_mvp2_05.py'
      - 'tests/test_weaver_mvp2_07.py'
      - 'tests/test_evidence_verification_boundary.py'
      - 'tests/test_workevent_evidence_boundary.py'
      - 'tests/test_verification_review_boundary.py'
      - 'tests/test_execution_workevent_boundary.py'
      - 'tests/test_authority_boundary.py'
      - 'weaver/enterprise_orchestration.py'
      - 'RECONCILED-BOUNDARY-MAP-01.md'
      - '.github/workflows/weaver-mvp2-validation.yml'
      # The engineering-router truthfulness guard judges router semantics: an
      # unrecognized move status must be named, never silently skipped. Without
      # these paths a router change is judged by no workflow and the hourly
      # scheduler can regress to reporting "all complete" for a live frontier.
      - 'tests/test_engineering_router_status_truthfulness.py'
      - 'tests/test_engineering_scheduler_bootstrap.py'
      # The worker→attention composition seam and its attention half-guard. The
      # seam is the layer the hourly scheduler actually invokes; both were pinned
      # but executed by no workflow, so the chain could break between the router
      # and the attention builder while both half-guards stayed green. Kept
      # identical to the pull_request filter below.
      - 'tests/test_attention_truthfulness.py'
      - 'tests/test_worker_attention_composition.py'
  # The gate previously ran only on push to main, so it could never block a
  # broken PR — it could only report after the merge was already canonical.
  pull_request:
    paths:
      - 'solspire/**'
      - 'weaver/**'
      - 'web/public_prism/src/pages/ProjectDashboard.tsx'
      - 'tests/test_weaver_mvp2_05.py'
      - 'tests/test_weaver_mvp2_07.py'
      - 'tests/test_evidence_verification_boundary.py'
      - 'tests/test_workevent_evidence_boundary.py'
      - 'tests/test_verification_review_boundary.py'
      - 'tests/test_execution_workevent_boundary.py'
      - 'tests/test_authority_boundary.py'
      - 'weaver/enterprise_orchestration.py'
      - 'RECONCILED-BOUNDARY-MAP-01.md'
      - '.github/workflows/weaver-mvp2-validation.yml'
      # Kept identical to the push filter above: a guard absent from the
      # pull_request filter is judged by nothing until after the merge.
      - 'tests/test_engineering_router_status_truthfulness.py'
      - 'tests/test_engineering_scheduler_bootstrap.py'
      - 'tests/test_attention_truthfulness.py'
      - 'tests/test_worker_attention_composition.py'
  workflow_dispatch:

jobs:
  mvp2-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # pytest is not a runtime dependency, so every workflow that runs tests
      # installs it explicitly. This gate omitted it and therefore failed with
      # exit 127 ("pytest: command not found") without ever executing a test.
      - run: python -m pip install pytest
      - name: Weaver MVP2 and authority-boundary regressions
        run: >-
          python -m pytest -q
          tests/test_weaver_mvp2_05.py
          tests/test_weaver_mvp2_07.py
          tests/test_evidence_verification_boundary.py
          tests/test_workevent_evidence_boundary.py
          tests/test_verification_review_boundary.py
          tests/test_execution_workevent_boundary.py
          tests/test_authority_boundary.py

      - name: Engineering-router status truthfulness guard
        # Executed on every event (push, pull_request, dispatch) so a router change
        # that regresses silent-skip behaviour is judged before it reaches main.
        run: >-
          python -m pytest -q
          tests/test_engineering_router_status_truthfulness.py
          tests/test_engineering_scheduler_bootstrap.py

      - name: Worker→attention composition seam guard
        # Executed on every event. The step above judges the router and the
        # attention builder in isolation; this step drives the seam between them —
        # `EngineeringWorker.run()`, what the hourly scheduler invokes — so a break
        # that leaves both halves green fails here instead of silencing the hourly
        # stop in production.
        run: >-
          python -m pytest -q
          tests/test_attention_truthfulness.py
          tests/test_worker_attention_composition.py
