name: Static Ingestion Corpus

# `tests/test_static_ingestion_sources.py` pins the declared static-ingestion
# sources against the corpus they resolve. `test_adr_source_root_resolves_and_holds_the_records`
# asserted a *frozen six-name list* while the declared glob is `*.md`, so adding
# ADR-016 (`ba3c7b57`) reddened the guard with no change to the source it guards.
# The pin now states the property (a non-empty corpus of `ADR-<n>-*.md` records that
# retains its recorded history) instead of a snapshot.
#
# But the guard was also executed by no workflow — `grep -rn test_static_ingestion
# .github/workflows/` returns 0 — so it held only when a human ran the suite by hand.
# That is the defect class this repository already names: a guard no gate runs is
# decoration. This workflow is the executable surface.
#
# The guard's domain is the ADR corpus directory plus the module that declares it, so
# the filter names both. `tests/test_static_ingestion_corpus_ci_wiring.py` derives the
# guard's inputs and proves every one is selected, and proves the executing step can
# fail the job.
on:
  pull_request:
    paths:
      - ".github/workflows/static-ingestion-corpus.yml"
      - "docs/adr/**"
      - "knowledge/static_ingestion.py"
      - "tests/test_static_ingestion_sources.py"
      - "tests/test_static_ingestion_corpus_ci_wiring.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-ingestion-corpus.yml"
      - "docs/adr/**"
      - "knowledge/static_ingestion.py"
      - "tests/test_static_ingestion_sources.py"
      - "tests/test_static_ingestion_corpus_ci_wiring.py"
  workflow_dispatch:

jobs:
  static-ingestion-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml
      - name: Static-ingestion corpus guards
        run: |
          python -m pytest tests/test_static_ingestion_sources.py tests/test_static_ingestion_corpus_ci_wiring.py -q
