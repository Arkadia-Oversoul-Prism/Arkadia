name: Prism Console Contract

# The active console (`web/arkadia_console`) and the serving path that fronts it
# (`api/frontend_routes.py`) are judged by a derived set of contract guards. This
# gate must *execute* that whole set, and `tests/test_prism_console_ci_wiring.py`
# must *verify* it is executed.
#
# The executed inventory is DERIVED, not restated:
#
#     python -m pytest -q $(python scripts/console_contract_domain.py)
#
# `scripts/console_contract_domain.py` is the single source of truth, and the
# wiring judge imports `derive_domain` from the same file. A fixed list here would
# drift from that derivation the moment a guard is added: measured on `main` @
# `17988afd`, after PR #435 merged, three new console guards arrived
# (`tests/test_knowledge_projects_boundary.py`,
# `tests/test_knowledge_timeline_boundary.py`,
# `tests/test_prism_opportunity_entry_flow.py`) while this gate still ran the
# twelve it was written with -- so `_complete_gates()` returned `[]` and the whole
# console contract had no complete gate again, silently. `b8869c04` repaired that
# instance by extending the fixed list to sixteen; this change removes the class by
# deriving the inventory, so the next guard to arrive is executed without an edit.
#
# The `paths` filter selects `tests/**` rather than an enumerated guard list so a
# guard *added* to the corpus also triggers the judge that would otherwise never
# run to report it unexecuted. The judge still asserts every derived guard is
# selected, so narrowing this filter reddens it.

on:
  pull_request:
    paths:
      - "web/arkadia_console/**"
      - "api/frontend_routes.py"
      - "scripts/console_contract_domain.py"
      - "tests/**"
      - ".github/workflows/prism-console-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "web/arkadia_console/**"
      - "api/frontend_routes.py"
      - "scripts/console_contract_domain.py"
      - "tests/**"
      - ".github/workflows/prism-console-contract.yml"
  # The gate is path-filtered, so a revision touching none of the above never runs
  # it. `workflow_dispatch` lets the console contract be executed against an exact
  # revision on demand (it runs the workflow file from the dispatched ref, so
  # `ref=main` yields an execution at the current main SHA).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          # The domain is DERIVED from the corpus, so it grows when a guard joins
          # it — and at least one guard it can now reach reads repository
          # *history*: `test_console_posture_currency.py` resolves
          # `MAP_DERIVED_FROM` with `git cat-file -e`, so that commit must exist
          # as an object. The default `fetch-depth: 1` omits it and the guard
          # fails with "ae847dd is not a commit in this repository" — a wiring
          # defect that reads as a console defect. The posture gate already
          # fetches full history for the same reason; measured on a depth-1
          # checkout of this revision: `1 failed, 1035 passed`; full clone:
          # `1036 passed`.
          fetch-depth: 0
      # The derived console-contract domain executes the real TypeScript
      # mission-lifecycle adapter. Install the same locked console toolchain
      # used by the frontend build before running that contract suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install canonical console toolchain
        working-directory: web/arkadia_console
        run: |
          npm install --global pnpm@10.26.1
          pnpm install --frozen-lockfile
          pnpm exec tsc --version
      # AO4-01 / AO4-05 / AO4-06: the console's *runtime* behaviour is now gated
      # here, not only its source text. The Python guards below are structural;
      # they were green while the workspace canvas had collapsed to rail width
      # and the chrome publisher looped forever, because neither defect is
      # visible in source. These two steps are the executable checks that fail
      # when the canvas collapses, the render loop returns, duplicate navigation
      # appears, overflow is introduced, or the chrome publisher stops exposing
      # the active surface's rail.
      #
      # No `continue-on-error` anywhere: a red behavioural or layout check must
      # redden the gate.
      - name: Console behavioural tests (React, real modules)
        working-directory: web/arkadia_console
        run: pnpm exec vitest run
      - name: Console typecheck
        working-directory: web/arkadia_console
        run: pnpm exec tsc --noEmit
      - name: Console production build
        working-directory: web/arkadia_console
        run: pnpm exec vite build
      - name: Install Playwright Chromium
        working-directory: web/arkadia_console
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Workspace layout assertions (rendered, stubbed identity)
        # Measures the *rendered* workspace at 1440x900, 1024x768 and 390x844
        # through the test-only layout harness. The harness mounts the real
        # `Shell` and `WorkspaceShell` with a clearly labelled stub identity
        # because the protected route otherwise renders its sign-in threshold —
        # this is layout evidence, NOT authenticated acceptance, and the report
        # it writes says so.
        working-directory: web/arkadia_console
        run: |
          pnpm exec vite --port 5199 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5199/layout-harness.html >/dev/null && break
            sleep 1
          done
          python render_check_layout.py \
            --base-url http://127.0.0.1:5199 \
            --routes /layout-harness.html \
            --identity-label "STUBBED IDENTITY (layout harness) — not authenticated, not a test identity"
      - name: Install Python backend and contract-test dependencies
        # The authenticated layout check boots api.main through the existing
        # development identity seam. Install the same backend dependencies used
        # by the contract suite before invoking uvicorn; otherwise this check
        # fails at process startup and never measures the protected routes.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -c "import uvicorn; print('uvicorn', uvicorn.__version__)"
      - name: Workspace layout assertions (rendered, authenticated test identity)
        # AO4-05/06 + DEA-01 canvas: the real protected routes (`/workspace`, `/arkana`, `/weaver`, `/engineering-lab`) render
        # under a disposable test identity and their layout is asserted. The
        # identity authenticates through the backend's documented dev-mode seam
        # (`api/auth.py` decodes the bearer payload without verifying its
        # signature outside production) — NOT Firebase, and the report labels it
        # as such. The backend runs with `--lifespan off` (the auth seam
        # initialises at import, not in lifespan) and `ENVIRONMENT=development`
        # (dev-mode is refused in production, so this cannot weaken production
        # identity verification). `--require-authenticated` fails the run if the
        # protected route rendered its sign-in threshold instead of the surface,
        # so a stubbed or unauthenticated render can never be reported as
        # authenticated. No `continue-on-error`: a red layout check reddens the
        # gate.
        working-directory: web/arkadia_console
        run: |
          # Backend: dev-mode identity seam, no background daemons.
          ( cd ../.. && ENVIRONMENT=development PYTHONPATH=. \
              python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 --lifespan off \
              > /tmp/ao005-backend.log 2>&1 & )
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null || { echo "backend did not start"; tail -40 /tmp/ao005-backend.log; exit 1; }
          # Frontend: the test-identity seam is opt-in via the env var.
          VITE_ARKADIA_TEST_IDENTITY=1 pnpm exec vite --port 5200 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5200/ >/dev/null && break
            sleep 1
          done
          python render_check_layout.py \
            --base-url http://127.0.0.1:5200 \
            --routes "/workspace,/arkana,/weaver,/engineering-lab" \
            --require-authenticated \
            --identity-label "DISPOSABLE TEST IDENTITY (dev-mode, not Firebase)"
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-layout-evidence
          path: web/arkadia_console/render_evidence/
          if-no-files-found: error
      - name: Verify the console contract guards
        # The inventory is derived from `scripts/console_contract_domain.py`, the
        # same source of truth the wiring judge imports. A guard added to the
        # corpus is executed here without editing this file; a guard removed drops
        # out of both.
        run: >-
          python -m pytest -q
          $(python scripts/console_contract_domain.py)
      - name: Console-contract CI-wiring guard
        # Judges the gate's own trigger: the domain must be selected by this file's
        # `paths` filter and every executing step must be able to fail. A rewrite of
        # this file is judged by itself, or the gate is self-exempt.
        run: python -m pytest tests/test_prism_console_ci_wiring.py -q
