name: _probe_render_blank
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Probe canonical Render production
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            page.on('console', m => console.log(`[console:${m.type()}] ${m.text()}`));
            page.on('pageerror', e => console.log(`[pageerror] ${e.stack || e.message}`));
            page.on('requestfailed', r => console.log(`[requestfailed] ${r.url()} :: ${r.failure()?.errorText}`));
            page.on('response', r => { const u=r.url(); if(u.includes('onrender.com')||u.includes('/assets/')) console.log(`[response] ${r.status()} ${u}`); });
            const target='https://arkadia-prism-render-fixed.onrender.com/';
            const response=await page.goto(target,{waitUntil:'networkidle',timeout:60000});
            console.log(`[page] status=${response?.status()} url=${page.url()}`);
            console.log(`[title] ${await page.title()}`);
            console.log(`[body] ${((await page.locator('body').innerText()).slice(0,2000)||'<EMPTY>')}`);
            console.log(`[root children] ${await page.locator('#root').locator('> *').count()}`);
            console.log(`[root html] ${(await page.locator('#root').innerHTML()).slice(0,4000)}`);
            console.log(`[scripts] ${JSON.stringify(await page.locator('script').evaluateAll(xs=>xs.map(x=>x.src||'<inline>')))}`);
            await page.screenshot({path:'render-blank-probe.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: render-blank-probe
          path: render-blank-probe.png
