name: HTTP Error Contract

# `tests/test_http_error_contract.py` holds the API's 5xx error contract: a server
# error must not return the uncaught exception's own text (which can carry
# filesystem paths, SQL and provider internals), and a hidden cause must reach the
# log. Measured on `main` @ `bb19aabd`: sixteen 5xx sites in
# `api/knowledge_routes.py` returned `detail=str(e)` on anonymously reachable
# routes, and `api/economic_seam_routes.py` told the operator to "inspect server
# logs" while writing none.
#
# That guard is executed by **no other workflow**. `grep -rln
# test_http_error_contract .github/workflows/` returned 0 before this file existed;
# the `tests/**` filters on `economic-seam-engine.yml` and
# `prism-console-contract.yml` run only their own derived domains, and
# `knowledge-connection-lifecycle-guard.yml` is deliberately stdlib+pytest only,
# while this guard imports the application to drive real routes. A guard no gate
# executes is decoration; this workflow is the executable surface.
#
# The filter selects `api/**` because that is the surface the invariant governs: a
# new leaking handler can be added to any module there, not only to the two this
# change repaired. `tests/test_http_error_contract_ci_wiring.py` asserts each of
# these properties against this file, so a rewrite is judged by itself.
on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_http_error_contract.py"
      - "tests/test_http_error_contract_ci_wiring.py"
      - ".github/workflows/http-error-contract.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_http_error_contract.py"
      - "tests/test_http_error_contract_ci_wiring.py"
      - ".github/workflows/http-error-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-error-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # The guard drives real routes through the canonical application, so it needs
      # the backend dependencies; `pyyaml` is read by the wiring judge.
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest pyyaml
      - name: HTTP error contract guards
        run: python -m pytest tests/test_http_error_contract.py -q
      - name: HTTP error contract CI-wiring guard
        # Judges this gate's own trigger and executing steps. No
        # `continue-on-error`: a red guard must redden the job.
        run: python -m pytest tests/test_http_error_contract_ci_wiring.py -q
