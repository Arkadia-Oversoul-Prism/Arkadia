name: Arkadia Genesis Agent
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: 'Manual Weaver Task'
        default: 'Perform total system synthesis'

jobs:
  weaver_evolution:
    if: contains(github.event.comment.body, '/weaver') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Read-only: this job runs on untrusted trigger text and must never hold a
    # token that can write to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          pip install requests google-generativeai

      - name: Execute Weaver Recursive Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
          # The trigger text is untrusted (any commenter supplies it). It is passed
          # through the environment and never interpolated into the `run:` block:
          # `${{ }}` is substituted before bash parses the script, so a comment
          # containing `$(...)` would otherwise execute as a command.
          WEAVER_TASK_INPUT: ${{ github.event.comment.body || github.event.inputs.task }}
        run: |
          set -euo pipefail
          CLEAN_TASK="$(printf '%s' "$WEAVER_TASK_INPUT" | sed 's|/weaver ||g')"

          echo "Initiating Weaver with Task: $CLEAN_TASK"

          # Canonical governed entrypoint. The previous `python3 weaver.py
          # --recursive --enabled` referenced a file that is not in this
          # repository, so the step always failed. The workbench is read-only by
          # default and cannot originate authority.
          python3 -m weaver.workbench recon --objective "$CLEAN_TASK"
