name: CP10 Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'api/lab_routes.py'
      - 'tests/test_engineering_lab.py'
      - 'tests/test_engineering_lab_api.py'
      - 'web/public_prism/src/components/solspire/**'
      - 'web/public_prism/src/App.tsx'
      - 'web/public_prism/src/lib/apiClient.ts'
      - 'web/public_prism/src/lib/apiConfig.ts'
      - 'web/public_prism/package.json'
      - 'web/public_prism/pnpm-lock.yaml'
      - 'requirements.txt'
      - '.github/workflows/cp10-verification.yml'

permissions:
  contents: read

env:
  BASE_SHA: bb87a9a2c76cde7089af102f4dea67e2645399bc

jobs:
  cp10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: CP10-A Lab tests
        id: lab
        continue-on-error: true
        run: python -m pytest tests/test_engineering_lab.py tests/test_engineering_lab_api.py -q 2>&1 | tee cp10-lab.log

      - name: CP10-B broader backend regression
        id: backend
        continue-on-error: true
        run: python -m pytest tests/ -q 2>&1 | tee cp10-backend.log

      - name: Start existing backend
        run: nohup env PYTHONPATH=. python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 --log-level info > cp10-backend-runtime.log 2>&1 &

      - name: Backend readiness
        id: backend_ready
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, urllib.request
          deadline=time.time()+90
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',timeout=5) as r:
                      if r.status==200: print('PASS status=200'); raise SystemExit(0)
              except Exception: pass
              time.sleep(2)
          raise SystemExit('Backend readiness FAIL')
          PY

      - name: API verification
        id: api
        continue-on-error: true
        run: |
          python - <<'PY' | tee cp10-api.log
          import base64,json,urllib.error,urllib.request
          base='http://127.0.0.1:8000'
          def get(path,token=None):
              h={} if not token else {'Authorization':'Bearer '+token}
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers=h),timeout=60) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read().decode())
          s,p=get('/api/lab/overview'); print('UNAUTHENTICATED',s)
          if s!=401: raise SystemExit(f'Expected 401, got {s}')
          def b64(x): return base64.urlsafe_b64encode(json.dumps(x,separators=(',',':')).encode()).decode().rstrip('=')
          token='.'.join([b64({'alg':'none','typ':'JWT'}),b64({'sub':'cp10-verification-user','user_id':'cp10-verification-user','email':'cp10@example.invalid'}),'cp10-test-signature'])
          s,p=get('/api/lab/overview',token); print('AUTHENTICATED',s)
          if s!=200: raise SystemExit(f'Expected 200 in existing local dev-mode auth, got {s}')
          required={'repository','architecture','trajectory','patterns','canon','governance'}
          if not required.issubset(p): raise SystemExit(f'Missing fields: {sorted(required-set(p))}')
          blob=json.dumps(p)
          if any(x in blob for x in ('AIza','PRIVATE KEY','GEMINI_API_KEY','FIREBASE_SERVICE_ACCOUNT_JSON')): raise SystemExit('Sensitive marker leaked')
          print('Structure PASS; response secret scan PASS')
          PY

      - name: Install frontend dependencies
        working-directory: web/public_prism
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Prism
        working-directory: web/public_prism
        run: pnpm build

      - name: Start existing frontend
        run: nohup pnpm --dir web/public_prism dev --host 127.0.0.1 --port 5000 > cp10-frontend-runtime.log 2>&1 &

      - name: Frontend readiness
        id: frontend_ready
        continue-on-error: true
        run: |
          python - <<'PY'
          import time,urllib.request
          deadline=time.time()+60
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5000/',timeout=5) as r:
                      if r.status==200: print('PASS status=200'); raise SystemExit(0)
              except Exception: pass
              time.sleep(2)
          raise SystemExit('Frontend readiness FAIL')
          PY

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Browser route and SolSpire verification
        id: browser
        continue-on-error: true
        run: |
          node <<'NODE' | tee cp10-browser.log
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage();
            const ce=[],pe=[],fr=[]; p.on('console',m=>m.type()==='error'&&ce.push(m.text())); p.on('pageerror',e=>pe.push(e.message)); p.on('requestfailed',r=>fr.push(r.url()+' :: '+r.failure()?.errorText));
            for(const path of ['/solspire','/solspire/projects','/solspire/engineering-lab','/solspire/knowledge','/solspire/files','/solspire/conversations','/solspire/tasks','/solspire/memory','/solspire/weaver','/solspire/observatory','/solspire/settings']){
              const r=await p.goto('http://127.0.0.1:5000'+path,{waitUntil:'networkidle',timeout:60000}); const text=await p.locator('body').innerText();
              console.log(`[route] ${path} status=${r?.status()} final=${p.url()}`); if(r?.status()!==200||!text.includes('PRIVATE WORKSPACE')) throw new Error(`${path} auth threshold failed`);
            }
            await p.goto('http://127.0.0.1:5000/solspire/engineering-lab',{waitUntil:'networkidle',timeout:60000}); await p.screenshot({path:'cp10-engineering-lab.png',fullPage:true});
            console.log('consoleErrors='+JSON.stringify(ce)); console.log('pageErrors='+JSON.stringify(pe)); console.log('failedRequests='+JSON.stringify(fr));
            if(ce.length||pe.length||fr.length) throw new Error('Browser runtime errors observed');
            console.log('Unauthenticated Engineering Lab route threshold: PASS');
            console.log('Authenticated Engineering Lab lens: BLOCKED. No legitimate existing browser-auth test session/credential is available; no auth bypass permitted.');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Security artifact scan
        id: security
        continue-on-error: true
        run: |
          set -e
          for f in cp10-*.log; do [ -f "$f" ] || continue; if grep -Eq 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT_JSON=|GEMINI_API_KEY=|Authorization: Bearer eyJ' "$f"; then echo "Sensitive material detected in $f"; exit 1; fi; done
          echo 'Runtime artifact secret scan: PASS'

      - name: Mutation boundary
        id: mutation
        run: |
          set -e
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          [ "$changed" = '.github/workflows/cp10-verification.yml' ]
          if git diff "$BASE_SHA" HEAD -- .github/workflows/cp10-verification.yml | grep -Eq 'git (push|commit)|gh (pr|workflow) (create|merge)|vercel|render deploy'; then exit 1; fi
          echo 'Application mutation: NONE'; echo 'Repository mutation by workflow: NONE'; echo 'Production mutation: NONE'; echo 'Autonomous mutation: NONE'

      - name: CP10 summary
        if: always()
        run: |
          {
            echo '# CP10 Verification Summary'
            echo "Commit: $GITHUB_SHA"
            echo "Lab tests: ${{ steps.lab.outcome }}"
            echo "Broader backend regression: ${{ steps.backend.outcome }}"
            echo "Backend readiness: ${{ steps.backend_ready.outcome }}"
            echo "API verification: ${{ steps.api.outcome }}"
            echo "Frontend build: success"
            echo "Frontend readiness: ${{ steps.frontend_ready.outcome }}"
            echo "Browser verification: ${{ steps.browser.outcome }}"
            echo "Security scan: ${{ steps.security.outcome }}"
            echo "Mutation boundary: ${{ steps.mutation.outcome }}"
            echo 'Authenticated browser Engineering Lab lens: BLOCKED; legitimate test session/credential unavailable.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CP10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp10-evidence-${{ github.sha }}
          path: |
            cp10-*.log
            cp10-engineering-lab.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce CP10 gates
        if: always()
        run: |
          test '${{ steps.lab.outcome }}' = success
          test '${{ steps.backend.outcome }}' = success
          test '${{ steps.backend_ready.outcome }}' = success
          test '${{ steps.api.outcome }}' = success
          test '${{ steps.frontend_ready.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.security.outcome }}' = success
          test '${{ steps.mutation.outcome }}' = success
          echo 'Authenticated browser Engineering Lab lens remains BLOCKED; CP10 cannot be sealed from this environment.'
          exit 2
