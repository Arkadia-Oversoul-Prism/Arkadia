name: SG-02-FE.2-V

on:
  push:
    branches: [main]
    paths:
      - 'web/public_prism/**'
      - 'spiral_grove/**'
      - 'lab/**'
      - 'api/lab_routes.py'
      - 'tests/test_spiral_grove_frontend_projection.py'
      - 'tests/test_spiral_grove_chambers.py'
      - 'tests/test_spiral_grove_learning_path.py'
      - 'tests/test_spiral_grove_learning_path_projection.py'
      - 'tests/test_engineering_lab.py'
      - 'tests/test_engineering_lab_api.py'
      - 'tests/test_phase3_harness_selftest.py'
      - 'tests/test_phase3_council.py'
      - 'lab/council/**'
      - 'lab/evolution/**'
      - 'lab/execution/**'
      - 'tests/test_phase5_governed_execution.py'
      - 'tests/test_phase4_evolution_planner.py'
      - 'lab/evolution/**'
      - 'lab/execution/**'
      - 'tests/test_phase5_governed_execution.py'
      - 'tests/test_phase4_evolution_planner.py'
      - 'requirements.txt'
      - '.github/workflows/sg-02-fe-2-v.yml'
  pull_request:
    paths:
      - 'web/public_prism/**'
      - 'spiral_grove/**'
      - 'lab/**'
      - 'api/lab_routes.py'
      - 'tests/test_spiral_grove_frontend_projection.py'
      - 'tests/test_spiral_grove_chambers.py'
      - 'tests/test_spiral_grove_learning_path.py'
      - 'tests/test_spiral_grove_learning_path_projection.py'
      - 'tests/test_engineering_lab.py'
      - 'tests/test_engineering_lab_api.py'
      - 'tests/test_phase3_harness_selftest.py'
      - 'tests/test_phase3_council.py'
      - 'lab/council/**'
      - 'requirements.txt'
      - '.github/workflows/sg-02-fe-2-v.yml'
  workflow_dispatch:
    inputs:
      vite_firebase_api_key:
        description: "VITE_FIREBASE_API_KEY (Option 3 non-repo supply)"
        required: false
        default: ""
      vite_firebase_auth_domain:
        description: "VITE_FIREBASE_AUTH_DOMAIN"
        required: false
        default: ""
      vite_firebase_project_id:
        description: "VITE_FIREBASE_PROJECT_ID"
        required: false
        default: ""
      vite_firebase_app_id:
        description: "VITE_FIREBASE_APP_ID"
        required: false
        default: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Option 3: workflow_dispatch inputs (empty on push/PR → auth browser gate stays deferred)
      VITE_FIREBASE_API_KEY: ${{ github.event.inputs.vite_firebase_api_key || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ github.event.inputs.vite_firebase_auth_domain || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ github.event.inputs.vite_firebase_project_id || '' }}
      VITE_FIREBASE_APP_ID: ${{ github.event.inputs.vite_firebase_app_id || '' }}
      FIREBASE_WEB_API_KEY: ${{ github.event.inputs.vite_firebase_api_key || '' }}
    defaults:
      run:
        working-directory: web/public_prism
    steps:
      - uses: actions/checkout@v4
        with:
          # Need parent commit for mutation-boundary HEAD^ checks (default depth=1 → exit 128).
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: web/public_prism/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Prism
        run: pnpm build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project Python dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Install test runner
        working-directory: .
        run: python -m pip install pytest
      - name: Phase 3 harness self-test
        id: phase3_harness
        working-directory: .
        run: |
          set -e
          python -m pytest tests/test_phase3_harness_selftest.py -q
          # Inline injected failure must fail the pipeline under pipefail
          set -o pipefail
          if node -e 'process.exit(1)' | tee /tmp/cp10-phase3-inline-selftest.log; then
            echo "SELFTEST FAIL: injected node exit 1 did not fail pipeline"
            exit 1
          fi
          echo "Phase 3 harness self-test PASS"
      - name: Phase 3 Tri-Nodal Council fixtures
        id: phase3_council
        working-directory: .
        run: |
          set -e
          python -m pytest tests/test_phase3_council.py -q
          echo "Phase 3 Tri-Nodal Council fixtures PASS"
      - name: Phase 4 Evolution Planner fixtures
        id: phase4_planner
        working-directory: .
        run: |
          set -e
          python -m pytest tests/test_phase4_evolution_planner.py -q
          echo "Phase 4 Evolution Planner fixtures PASS"
      - name: Phase 5 Governed Execution dry-run fixtures
        id: phase5_execution
        working-directory: .
        run: |
          set -e
          python -m pytest tests/test_phase5_governed_execution.py -q
          echo "Phase 5 Governed Execution fixtures PASS"
      - name: Grove contracts
        working-directory: .
        continue-on-error: true
        run: python -m pytest tests/test_spiral_grove_frontend_projection.py tests/test_spiral_grove_chambers.py tests/test_spiral_grove_learning_path.py tests/test_spiral_grove_learning_path_projection.py -q 2>&1 | tee cp10-grove.log
      - name: CP10-A Lab tests
        id: lab
        working-directory: .
        continue-on-error: true
        run: python -m pytest tests/test_engineering_lab.py tests/test_engineering_lab_api.py -q 2>&1 | tee cp10-lab.log
      - name: CP10-B broader backend regression
        id: backend
        working-directory: .
        continue-on-error: true
        run: python -m pytest tests/ -q 2>&1 | tee cp10-backend.log
      - name: Start existing backend runtime
        working-directory: .
        run: nohup env PYTHONPATH=. python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 --log-level info > cp10-backend-runtime.log 2>&1 &
      - name: Backend readiness
        id: backend_ready
        working-directory: .
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, urllib.request
          deadline=time.time()+90
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',timeout=5) as r:
                      if r.status==200: print('Backend readiness PASS'); raise SystemExit(0)
              except Exception: pass
              time.sleep(2)
          raise SystemExit('Backend readiness FAIL')
          PY
      - name: CP10 API verification
        id: api
        working-directory: .
        continue-on-error: true
        run: |
          python - <<'PY' | tee cp10-api.log
          import base64,json,urllib.error,urllib.request
          def b64(x): return base64.urlsafe_b64encode(json.dumps(x,separators=(',',':')).encode()).decode().rstrip('=')
          def get(token=None):
              h={} if not token else {'Authorization':'Bearer '+token}
              try:
                  with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/lab/overview',headers=h),timeout=60) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e: return e.code,json.loads(e.read().decode())
          s,p=get(); print('UNAUTHENTICATED',s); assert s==401, s
          token='.'.join([b64({'alg':'none','typ':'JWT'}),b64({'sub':'cp10-verification-user','user_id':'cp10-verification-user','email':'cp10@example.invalid'}),'cp10-test-signature'])
          s,p=get(token); print('AUTHENTICATED',s); assert s==200, s
          assert {'repository','architecture','trajectory','patterns','canon','governance'} <= set(p)
          assert not any(x in json.dumps(p) for x in ('AIza','PRIVATE KEY','GEMINI_API_KEY','FIREBASE_SERVICE_ACCOUNT_JSON'))
          print('Lab response structure PASS; response secret scan PASS')
          PY
      - name: Start existing frontend runtime
        # Job default cwd is web/public_prism; do not nest --dir web/public_prism again.
        run: nohup pnpm dev --host 127.0.0.1 --port 5000 > "${GITHUB_WORKSPACE}/cp10-frontend-runtime.log" 2>&1 &
      - name: Frontend readiness
        id: frontend_ready
        continue-on-error: true
        run: |
          python - <<'PY'
          import time,urllib.request
          deadline=time.time()+60
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5000/',timeout=5) as r:
                      if r.status==200: print('Frontend readiness PASS'); raise SystemExit(0)
              except Exception: pass
              time.sleep(2)
          raise SystemExit('Frontend readiness FAIL')
          PY
      - name: Install Playwright Chromium
        # Isolate from web/public_prism/package-lock.json (LOCKFILE-ORIGINATED
        # package-firewall.replit.local resolved URLs). Install remains mandatory.
        working-directory: ${{ runner.temp }}
        env:
          npm_config_registry: https://registry.npmjs.org/
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: |
          set -e
          PW_DIR="${RUNNER_TEMP}/cp10-playwright"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          npm init -y
          npm install playwright --registry=https://registry.npmjs.org/
          npx playwright install --with-deps chromium
          # Export paths so mandatory browser verification can require('playwright')
          # without using web/public_prism lockfile-resolved packages.
          echo "NODE_PATH=${PW_DIR}/node_modules${NODE_PATH:+:$NODE_PATH}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" >> "$GITHUB_ENV"
      - name: CP10 provision disposable Firebase identity
        id: fb_user
        working-directory: .
        continue-on-error: true
        run: |
          set -e
          if [ -z "${VITE_FIREBASE_API_KEY}" ] || [ -z "${VITE_FIREBASE_AUTH_DOMAIN}" ] || [ -z "${VITE_FIREBASE_PROJECT_ID}" ] || [ -z "${VITE_FIREBASE_APP_ID}" ]; then
            echo "Firebase web config not supplied via workflow_dispatch — authenticated browser gate remains DEFERRED."
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tests.production.firebase_harness import provision_user
          u = provision_user(os.environ.get("GITHUB_RUN_ID", "cp10"), "cp10")
          # Runner-only credential file (never upload; not tee'd to logs)
          path = os.path.join(os.environ["RUNNER_TEMP"], "cp10-fb-user.env")
          with open(path, "w", encoding="utf-8") as f:
              f.write(f"CP10_FB_EMAIL={u.email}\n")
              f.write(f"CP10_FB_PASSWORD={u._password}\n")
              f.write(f"CP10_FB_UID={u.uid}\n")
          print(f"provisioned uid={u.uid} email_domain={u.email.split('@')[-1]}")
          PY
          echo "provisioned=true" >> "$GITHUB_OUTPUT"
          echo "cred_file=${RUNNER_TEMP}/cp10-fb-user.env" >> "$GITHUB_OUTPUT"
      - name: CP10 browser route verification
        id: browser
        continue-on-error: true
        run: |
          # Sequence B: make Node exit code visible through the tee pipeline.
          # Without pipefail, pipeline status is tee's (always 0) even when node exits 1.
          set -o pipefail
          node <<'NODE' | tee cp10-browser.log
          const {chromium}=require('playwright');
          const fs=require('fs');
          const path=require('path');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const ce=[],pe=[],fr=[];
            p.on('console',m=>m.type()==='error'&&ce.push(m.text()));
            p.on('pageerror',e=>pe.push(e.message));
            p.on('requestfailed',r=>fr.push(r.url()+' :: '+r.failure()?.errorText));
            for(const route of ['/solspire','/solspire/projects','/solspire/engineering-lab']){
              const r=await p.goto('http://127.0.0.1:5000'+route,{waitUntil:'networkidle',timeout:60000});
              const text=await p.locator('body').innerText();
              console.log(`[route] ${route} status=${r?.status()} final=${p.url()}`);
              if(r?.status()!==200||!text.includes('PRIVATE WORKSPACE')) throw new Error(`${route} auth threshold failed`);
            }
            await p.goto('http://127.0.0.1:5000/solspire/engineering-lab',{waitUntil:'networkidle',timeout:60000});
            await p.screenshot({path:'cp10-engineering-lab.png',fullPage:true});
            console.log('consoleErrors='+JSON.stringify(ce));
            console.log('pageErrors='+JSON.stringify(pe));
            console.log('failedRequests='+JSON.stringify(fr));
            if(ce.length||pe.length||fr.length) throw new Error('Browser runtime errors observed');
            console.log('Unauthenticated route threshold PASS');

            const apiKey=process.env.VITE_FIREBASE_API_KEY||'';
            const authDomain=process.env.VITE_FIREBASE_AUTH_DOMAIN||'';
            const projectId=process.env.VITE_FIREBASE_PROJECT_ID||'';
            const appId=process.env.VITE_FIREBASE_APP_ID||'';
            const credPath=process.env.CP10_FB_CRED_FILE||'';
            const canAuth=apiKey&&authDomain&&projectId&&appId&&credPath&&fs.existsSync(credPath);
            if(!canAuth){
              console.log('Authenticated Engineering Lab lens: DEFERRED BY ACCEPTANCE CRITERIA (Firebase web config or disposable identity not supplied for this run; not PASS).');
              await b.close();
              return;
            }

            const redact=(s)=>String(s||'').replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[REDACTED_JWT]').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[REDACTED_EMAIL]');
            let phase='auth_start';
            const dump=async(label)=>{
              try{
                const url=p.url();
                const bodySnippet=redact((await p.locator('body').innerText()).slice(0,800));
                console.log('[diag] phase='+phase+' label='+label+' url='+url);
                console.log('[diag] bodySnippet='+JSON.stringify(bodySnippet));
                console.log('[diag] consoleErrors='+JSON.stringify(ce.map(redact).slice(-20)));
                console.log('[diag] pageErrors='+JSON.stringify(pe.map(redact).slice(-20)));
                console.log('[diag] failedRequests='+JSON.stringify(fr.map(redact).slice(-30)));
                const shot='cp10-auth-fail-'+label.replace(/[^a-z0-9_-]/gi,'_')+'.png';
                await p.screenshot({path:shot,fullPage:true});
                console.log('[diag] screenshot='+shot);
              }catch(diagErr){console.log('[diag] dump_failed='+String(diagErr));}
            };

            const envTxt=fs.readFileSync(credPath,'utf8');
            const email=(envTxt.match(/^CP10_FB_EMAIL=(.*)$/m)||[])[1];
            const password=(envTxt.match(/^CP10_FB_PASSWORD=(.*)$/m)||[])[1];
            if(!email||!password) throw new Error('Disposable identity file incomplete');
            console.log('[phase] identity_loaded email_domain='+(email.split('@')[1]||'unknown'));

            phase='navigate_login';
            await p.goto('http://127.0.0.1:5000/login',{waitUntil:'networkidle',timeout:60000});
            console.log('[phase] login_page url='+p.url());
            phase='fill_form';
            await p.getByTestId('tab-signin').click();
            await p.getByTestId('input-email-signin').fill(email);
            await p.getByTestId('input-password-signin').fill(password);
            console.log('[phase] form_filled');
            phase='submit_signin';
            await p.getByTestId('button-signin').click();
            console.log('[phase] signin_clicked');
            // Observe post-submit without forcing navigation yet
            await p.waitForTimeout(4000);
            phase='post_submit_observe';
            console.log('[phase] post_submit url='+p.url());
            await dump('post_submit');

            phase='navigate_lab';
            await p.goto('http://127.0.0.1:5000/solspire/engineering-lab',{waitUntil:'networkidle',timeout:90000});
            for(let i=0;i<30;i++){
              const t=await p.locator('body').innerText();
              if(!t.includes('PRIVATE WORKSPACE') && (t.includes('Engineering Lab')||t.includes('Deterministic observation')||t.includes('OBSERVED')||t.includes('System state'))) {
                phase='hydrated_lab';
                break;
              }
              phase='wait_hydration_'+i;
              await p.waitForTimeout(2000);
              await p.reload({waitUntil:'networkidle'});
            }
            const body=await p.locator('body').innerText();
            await p.screenshot({path:'cp10-engineering-lab-authenticated.png',fullPage:true});
            if(body.includes('PRIVATE WORKSPACE')){
              await dump('lab_still_private');
              throw new Error('Authenticated Lab lens FAIL: PRIVATE WORKSPACE still present');
            }
            if(!(body.includes('Engineering Lab')||body.includes('Deterministic observation')||body.includes('System state')||body.includes('OBSERVED'))){
              await dump('lab_ui_missing');
              throw new Error('Authenticated Lab lens FAIL: expected Lab observation UI not found');
            }
            console.log('Authenticated Engineering Lab lens: PASS');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
        env:
          CP10_FB_CRED_FILE: ${{ steps.fb_user.outputs.cred_file }}
      - name: CP10 cleanup disposable Firebase identity
        if: always() && steps.fb_user.outputs.provisioned == 'true'
        working-directory: .
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tests.production.firebase_harness import DisposableUser, delete_user, refresh_id_token
          path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "cp10-fb-user.env")
          if not os.path.isfile(path):
              raise SystemExit(0)
          vals = {}
          for line in open(path, encoding="utf-8"):
              line=line.strip()
              if "=" in line:
                  k,v=line.split("=",1); vals[k]=v
          email=vals.get("CP10_FB_EMAIL"); password=vals.get("CP10_FB_PASSWORD"); uid=vals.get("CP10_FB_UID","")
          if not email or not password:
              raise SystemExit(0)
          u = DisposableUser(email=email, uid=uid, _password=password, _id_token="", run_id="cp10")
          refresh_id_token(u)
          ok = delete_user(u)
          print("cleanup_ok=" + str(bool(ok)))
          try: os.remove(path)
          except OSError: pass
          PY
      - name: CP10 security artifact scan
        id: security
        continue-on-error: true
        run: |
          set -e
          for f in cp10-*.log; do [ -f "$f" ] || continue; if grep -Eq 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT_JSON=|GEMINI_API_KEY=|Authorization: Bearer eyJ' "$f"; then echo "Sensitive material detected in $f"; exit 1; fi; done
          echo 'Runtime artifact secret scan PASS'
      - name: CP10 mutation boundary
        id: mutation
        working-directory: .
        run: |
          set -e
          # Parent must exist (fetch-depth >= 2). Fail clearly if not.
          git rev-parse --verify HEAD^ >/dev/null
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "Changed files since parent:"; echo "$changed"
          # Allow verification harness + Phase 3 council/self-test surfaces only.
          allow='^[.]github/workflows/sg-02-fe-2-v[.]yml$|^lab/council/|^lab/evolution/|^lab/execution/|^tests/test_phase|^docs/verification/PHASE|^docs/verification/EV_'
          if echo "$changed" | grep -v '^$' | grep -vqE "$allow"; then
            echo "Unexpected non-harness paths in tip commit:"; echo "$changed"; exit 1
          fi
          # Scan diff for deploy/mutation commands; ignore this step's own pattern line.
          if git diff HEAD^ HEAD -- .github/workflows/sg-02-fe-2-v.yml | grep -v 'grep -Eq' | grep -Eq '(^|[[:space:];|&])git[[:space:]]+(push|commit)|(^|[[:space:];|&])gh[[:space:]]+(pr|workflow)[[:space:]]+(create|merge)|vercel deploy|render deploy'; then
            echo "Forbidden deploy/mutation command pattern in workflow diff"; exit 1
          fi
          echo 'Application mutation: NONE'; echo 'Repository mutation by workflow: NONE'; echo 'Production mutation: NONE'; echo 'Autonomous mutation: NONE'
      - name: CP10 evidence summary
        if: always()
        run: |
          {
            echo '# CP10 Verification Summary'
            echo "Commit: $GITHUB_SHA"
            echo "Phase3 harness: ${{ steps.phase3_harness.outcome }}"
            echo "Phase3 council: ${{ steps.phase3_council.outcome }}"
            echo "Phase4 planner: ${{ steps.phase4_planner.outcome }}"
            echo "Phase5 execution: ${{ steps.phase5_execution.outcome }}"
            echo "Grove contracts: ${{ steps.grove.outcome }}"
            echo "Lab tests: ${{ steps.lab.outcome }}"
            echo "Broader backend regression: ${{ steps.backend.outcome }}"
            echo "Backend readiness: ${{ steps.backend_ready.outcome }}"
            echo "API verification: ${{ steps.api.outcome }}"
            echo "Frontend readiness: ${{ steps.frontend_ready.outcome }}"
            echo "Browser route verification: ${{ steps.browser.outcome }}"
            echo "Security scan: ${{ steps.security.outcome }}"
            echo "Mutation boundary: ${{ steps.mutation.outcome }}"
            echo "Authenticated browser Engineering Lab lens: see cp10-browser.log (PASS only if Firebase config supplied and assertions succeeded)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CP10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp10-evidence-${{ github.sha }}
          path: |
            cp10-*.log
            cp10-engineering-lab.png
            cp10-engineering-lab-authenticated.png
            cp10-auth-fail-*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce CP10 executable gates
        if: always()
        run: |
          test '${{ steps.phase3_harness.outcome }}' = success
          test '${{ steps.phase3_council.outcome }}' = success
          test '${{ steps.phase4_planner.outcome }}' = success
          test '${{ steps.phase5_execution.outcome }}' = success
          test '${{ steps.lab.outcome }}' = success
          test '${{ steps.backend.outcome }}' = success
          test '${{ steps.backend_ready.outcome }}' = success
          test '${{ steps.api.outcome }}' = success
          test '${{ steps.frontend_ready.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.security.outcome }}' = success
          test '${{ steps.mutation.outcome }}' = success
          # Path B: docs/verification/PHASE1_CP10_ACCEPTANCE_AMENDMENT.md
          # Authenticated browser Lab is not a Phase 1 seal gate.
          if grep -q 'Authenticated Engineering Lab lens: PASS' cp10-browser.log 2>/dev/null; then
            echo 'Authenticated browser Engineering Lab lens: PASS'
          elif grep -q 'DEFERRED BY ACCEPTANCE CRITERIA' cp10-browser.log 2>/dev/null; then
            echo 'Authenticated browser Engineering Lab lens: DEFERRED BY ACCEPTANCE CRITERIA (not PASS)'
          else
            echo 'Authenticated browser Engineering Lab lens: UNKNOWN (see cp10-browser.log)'
          fi
          echo 'Executable CP10 gates: PASS (browser step outcome success).'
          exit 0
