name: SG-02-FE.2-V

on:
  push:
    branches: [main]
    paths:
      - 'web/public_prism/**'
      - 'spiral_grove/**'
      - 'tests/test_spiral_grove_frontend_projection.py'
      - 'tests/test_spiral_grove_chambers.py'
      - 'tests/test_spiral_grove_learning_path.py'
      - 'requirements.txt'
      - '.github/workflows/sg-02-fe-2-v.yml'
  pull_request:
    paths:
      - 'web/public_prism/**'
      - 'spiral_grove/**'
      - 'tests/test_spiral_grove_frontend_projection.py'
      - 'tests/test_spiral_grove_chambers.py'
      - 'tests/test_spiral_grove_learning_path.py'
      - 'requirements.txt'
      - '.github/workflows/sg-02-fe-2-v.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/public_prism
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: web/public_prism/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Prism
        run: pnpm build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project Python dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Install test runner
        working-directory: .
        run: python -m pip install pytest
      - name: Grove contracts
        working-directory: .
        run: python -m pytest tests/test_spiral_grove_frontend_projection.py tests/test_spiral_grove_chambers.py tests/test_spiral_grove_learning_path.py -q
