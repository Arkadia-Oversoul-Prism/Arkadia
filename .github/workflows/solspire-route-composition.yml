name: SolSpire Router Composition Tests

on:
  pull_request:
    paths:
      - "solspire/**"
      - "tests/test_solspire_route_composition.py"
      - "tests/test_solspire_route_composition_ci_wiring.py"
      - "scripts/production_runtime_probe.py"
      - ".github/workflows/solspire-route-composition.yml"
  push:
    branches: ["main"]
    paths:
      - "solspire/**"
      - "tests/test_solspire_route_composition.py"
      - "tests/test_solspire_route_composition_ci_wiring.py"
      - "scripts/production_runtime_probe.py"
      - ".github/workflows/solspire-route-composition.yml"
  # The gate is path-filtered, so a revision that does not touch `solspire/**` never
  # runs it — measured at `3b74c19d`, the only run on record is at `73fbb51a`, and
  # neither that revision nor any non-solspire revision has a route-composition
  # execution. `workflow_dispatch` lets the composed-route contract be executed
  # against an exact revision on demand (it runs the workflow file from the
  # dispatched ref, so `ref=main` yields an execution at the current main SHA).
  # Guard: `tests/test_solspire_route_composition_ci_wiring.py`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Verify composed EDEN-OPS-02 routes
        run: python -m pytest tests/test_solspire_route_composition.py -q
      - name: Route-composition CI-wiring guard
        # Judges the gate's own trigger: the contract must be dispatchable and its
        # `paths` filter must select the contract and `solspire/**`. A rewrite of this
        # file is judged by itself, or the gate is self-exempt.
        run: python -m pytest tests/test_solspire_route_composition_ci_wiring.py -q
