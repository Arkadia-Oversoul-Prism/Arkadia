name: OpenAPI Security Metadata Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "api/main.py"
      - "api/openapi_security.py"
      - "api/auth.py"
      - "api/key_routes.py"
      - "api/lab_routes.py"
      - "api/**"
      - "solspire/**"
      - "tests/test_openapi_security_*.py"
      - ".github/workflows/openapi-security-metadata.yml"
  push:
    branches: [main]
    paths:
      - "api/main.py"
      - "api/openapi_security.py"
      - "api/auth.py"
      - "api/key_routes.py"
      - "api/lab_routes.py"
      - "api/**"
      - "solspire/**"
      - "tests/test_openapi_security_*.py"
      - ".github/workflows/openapi-security-metadata.yml"

permissions:
  contents: read

jobs:
  security-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Focused metadata unit tests
        run: python -m pytest tests/test_openapi_security_metadata.py -q
      - name: Reconcile the full composed OpenAPI schema
        run: python -m pytest tests/test_openapi_security_production_contract.py -q -rA
