name: _prism_network_routes_fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore direct network route definitions
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/public_prism/src/App.tsx')
          s = p.read_text()
          s = s.replace("novanet: '/nexus', ims: '/nexus/ims', grove: '/nexus/grove', larder: '/nexus/larder', distribute: '/nexus/distribution',", "novanet: '/nexus', ims: '/nexus/ims', grove: '/nexus/grove', larder: '/nexus/larder', distribute: '/nexus/distribution', encyclopedia: '/encyclopedia', 'spiral-codex': '/spiral-codex',")
          s = s.replace("'/nexus/distribution': 'distribute', '/offerings': 'offerings',", "'/nexus/distribution': 'distribute', '/encyclopedia': 'encyclopedia', '/spiral-codex': 'spiral-codex', '/offerings': 'offerings',")
          p.write_text(s)
      - name: Verify direct network routes
        shell: bash
        run: |
          grep -q "encyclopedia: '/encyclopedia'" web/public_prism/src/App.tsx
          grep -q "'spiral-codex': '/spiral-codex'" web/public_prism/src/App.tsx
          grep -q "'/encyclopedia': 'encyclopedia'" web/public_prism/src/App.tsx
          grep -q "'/spiral-codex': 'spiral-codex'" web/public_prism/src/App.tsx
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_prism_network_routes_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public_prism/src/App.tsx .github/workflows/_prism_network_routes_fix.yml
          git commit -m "fix(prism): expose codex and encyclopedia routes" || exit 0
          git push
