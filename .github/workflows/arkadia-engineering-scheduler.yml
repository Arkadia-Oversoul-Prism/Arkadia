name: Arkadia Engineering Scheduler

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Orientation mode (no code changes)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Hourly wake signal — not an instruction to execute a specific move
    - cron: "0 7-17 * * *"
  pull_request:
    # The trajectory-routing conformance guard judges the surfaces below. Without
    # this trigger the guard is selected only by nothing and runs nowhere, so the
    # structural slip it detects reaches main unjudged and the hourly session
    # fails closed again. Read-only: no merge, deploy, or push.
    paths:
      - ".github/workflows/arkadia-engineering-scheduler.yml"
      - "weaver/engineering_router.py"
      - "weaver/engineering_worker.py"
      - "docs/control-plane/trajectory.schema.json"
      - "docs/control-plane/TRAJECTORY-*.yaml"
      - "tests/test_scheduler_trajectory_conformance.py"
      - "tests/test_trajectory_schema_conformance.py"

concurrency:
  # max_active_moves: 1 — one engineering session at a time
  group: arkadia-engineering-session
  cancel-in-progress: false

jobs:
  engineering-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Establish repository SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Repository SHA: ${SHA}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pyyaml pytest

      - name: Trajectory-routing conformance guard
        # Runs on every event. On pull_request it judges the surfaces in the paths
        # filter before merge; on the hourly schedule it also proves this workflow
        # still selects the guard, so removing the trigger fails the next session
        # rather than silently disabling the guard.
        run: python -m pytest tests/test_scheduler_trajectory_conformance.py -q

      - name: Trajectory schema-vocabulary conformance guard
        # The sibling guard above proves structure; this one proves the move
        # status vocabulary agrees across the frozen schema, the router, and every
        # live trajectory. It is stdlib-only, so unlike tests/test_m08_* it runs
        # under `pip install pytest` and cannot be skipped for a missing install.
        run: python -m pytest tests/test_trajectory_schema_conformance.py -q

      - name: Session + Engineering Runner (dry-run default)
        if: github.event_name != 'pull_request'
        id: runner
        env:
          # schedule has no inputs — default dry_run true
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          ARKADIA_ENGINEERING_TRAJECTORY: docs/control-plane/TRAJECTORY-CONSOLE-COMPLETION-01.yaml
        run: |
          set -e
          SESSION="engineering-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DRY_RUN=true
          if [ "${INPUT_DRY_RUN}" = "false" ]; then DRY_RUN=false; fi
          echo "session_id=${SESSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          python - << PY
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from weaver.engineering_worker import EngineeringWorker

          dry = os.environ.get("INPUT_DRY_RUN", "true").lower() != "false"
          session = f"engineering-{os.environ.get('GITHUB_RUN_ID','local')}-{os.environ.get('GITHUB_RUN_ATTEMPT','1')}"
          worker = EngineeringWorker(repo_root=".", session_id=session, dry_run=dry)
          result = worker.run()
          Path("engineering-session-result.json").write_text(json.dumps(result, indent=2) + "\n")
          move = (result.get("next_move") or {}).get("id") or "NONE"
          print(f"::notice::status={result.get('status')} next_move={move}")
          print(json.dumps(result, indent=2))
          # Publish the outcome before any failure exit. The always() report step
          # interpolates these outputs, and with bash -e an exit 1 aborts the step,
          # so a write after it would leave the report blank on exactly the FAILED
          # orientation the report exists to explain (observed run 37379043890).
          # Keep this comment free of backticks and dollar signs: the heredoc
          # delimiter is unquoted, so the shell would expand them.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"status={result.get('status')}\n")
              fh.write(f"move={move}\n")
          # Orientation failure → fail job; NO_LEGAL_MOVE is clean stop (success)
          if result.get("status") == "FAILED":
              sys.exit(1)
          PY

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-session-${{ github.run_id }}
          path: |
            engineering-session-result.json
            docs/control-plane/evidence/**
          if-no-files-found: warn

      - name: Session report
        # A truthful stop must also be a legible one. `Status: NO_LEGAL_MOVE` with an
        # empty `Move:` says the session did not proceed, but not why: the router's
        # `blockers` — e.g. "unrecognized move status: G12-A ('merged_acceptance_pending')"
        # — live only in engineering-session-result.json. When attention delivery is
        # unconfigured this run log is the sole human-readable artifact, so a live
        # frontier was reported as a clean stop with no cause (run 37523927861). The
        # session writes the file before any failure exit, so it exists on every path;
        # on a pull_request the runner step is skipped and the report says so.
        if: always()
        run: |
          echo "=== ARKADIA ENGINEERING SESSION ==="
          echo "SHA:    ${{ steps.sha.outputs.sha }}"
          echo "Status: ${{ steps.runner.outputs.status }}"
          echo "Move:   ${{ steps.runner.outputs.move }}"
          echo "Trigger:${{ github.event_name }}"
          echo "Merge:  FORBIDDEN"
          echo "Deploy: FORBIDDEN"
          python - << 'PY'
          import json
          import pathlib

          result = pathlib.Path("engineering-session-result.json")
          if not result.is_file():
              print("Blockers: (session result unavailable)")
          else:
              blockers = json.loads(result.read_text(encoding="utf-8")).get("blockers") or []
              if blockers:
                  print("Blockers:")
                  for blocker in blockers:
                      print(f"  - {blocker}")
              else:
                  print("Blockers: none")
          PY
