name: Build MIE Android MVP

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "sonata-android/**"
      - "musical-intention-engine/**"
      - "tests/test_android_unit_test_classpath.py"
      - ".github/workflows/mie-android-build.yml"
  pull_request:
    paths:
      - "sonata-android/**"
      - "musical-intention-engine/**"
      - "tests/test_android_unit_test_classpath.py"
      - ".github/workflows/mie-android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build MIE / Sonata debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The gate that runs `testDebugUnitTest` is the only detector for a unit
      # test that reaches an Android framework class, and it is path-filtered to
      # this tree. Run the structural guard here so a test that cannot run on the
      # JVM is reported as that, not as an unexplained Gradle failure.
      - name: Unit-test classpath guard
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_android_unit_test_classpath.py -q

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x sonata-android/gradlew

      - name: Unit tests
        working-directory: sonata-android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: sonata-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mie-mvp-01-debug-${{ github.sha }}
          path: sonata-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
