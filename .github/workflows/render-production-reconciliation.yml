name: Render Production Reconciliation

on:
  pull_request:
    paths:
      - "api/**"
      - "web/public_prism/**"
      - "web/console/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - "architecture/runtime_manifest.yaml"
      - "scripts/reconcile_render_runtime.py"
      - ".github/workflows/render-production-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/public_prism/**"
      - "web/console/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - "architecture/runtime_manifest.yaml"
      - "scripts/reconcile_render_runtime.py"
      - ".github/workflows/render-production-reconciliation.yml"

permissions:
  contents: read

jobs:
  live-runtime:
    name: Reconcile canonical Render runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARKADIA_CANONICAL_BASE_URL: https://arkadia-qzu4.onrender.com
      EXPECTED_REVISION: ${{ github.sha }}
      WAIT_FOR_REVISION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
      RECONCILIATION_OUT: artifacts/render-reconciliation
      ENVIRONMENT: development
      SOVEREIGN_KEY: ci-only-nonproduction-placeholder
      CORS_ALLOWED_ORIGINS: https://arkadia-qzu4.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install source runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify canonical frontend routing contracts
        run: python -m pytest tests/test_canonical_frontend_routing.py -q
      - name: Capture live HTTP, OpenAPI, route, and authorization evidence
        run: python scripts/reconcile_render_runtime.py
      - name: Upload complete reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-runtime-reconciliation-${{ github.sha }}
          path: artifacts/render-reconciliation/
          if-no-files-found: warn
          retention-days: 30
