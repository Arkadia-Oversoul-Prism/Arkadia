name: Lane Doc Currency

# Executes the lane instruction-doc currency guard. Before this workflow, the
# guard tests ran only when a human invoked pytest by hand; the drift they
# detect (a lane doc pointing at a merged PR) had no continuous surface.
on:
  pull_request:
    paths:
      - "docs/control-plane/parallel-ui/**"
      - "scripts/lane_state.py"
      - "scripts/lane_state_refresh.py"
      - "tests/test_lane_instruction_doc_currency.py"
      - "tests/test_lane_currency_ci_wiring.py"
      - ".github/workflows/lane-doc-currency.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/control-plane/parallel-ui/**"
      - "scripts/lane_state.py"
      - "scripts/lane_state_refresh.py"
      - "tests/test_lane_instruction_doc_currency.py"
      - "tests/test_lane_currency_ci_wiring.py"
      - ".github/workflows/lane-doc-currency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-doc-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          # The liveness oracle decides "is this PR merged?" from local git
          # history (``git merge-base --is-ancestor``). A default depth-1
          # checkout does not hold the merge commits of the lane PRs, so the
          # oracle would report every PR as undecidable -- or, read naively, as
          # "not merged", a silent pass in the exact direction it exists to
          # catch. Full history is a requirement of the check, not a preference.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - name: Execute lane instruction-doc currency guard
        run: python -m pytest -q tests/test_lane_instruction_doc_currency.py
      - name: Execute the wiring guard (judges this workflow)
        # Run inside the gate so a rewrite of this workflow is judged by the
        # workflow it rewrites -- otherwise the gate can be disarmed by editing
        # the one file it is meant to constrain.
        run: python -m pytest -q tests/test_lane_currency_ci_wiring.py
      - name: Execute the guard as the gate executes it
        run: python scripts/lane_state.py --check
      - name: Verify lane PR state against GitHub (authoritative oracle)
        # The offline check can only prove the docs agree with the *snapshot*.
        # It cannot prove the snapshot agrees with GitHub -- and that is where
        # the measured failure was: all ten PRs the snapshot recorded as open
        # had closed, three of them unmerged, so every lane instruction pointed
        # a successor agent at a dead thread. An oracle no workflow executes is
        # decoration, so it runs here.
        #
        # Reads only (GET, never a mutation); the token is used for the request
        # and never printed. It fails closed: if GitHub cannot be reached the
        # step reports UNKNOWN and fails, rather than reading an unanswered
        # question as "no dead pointers". A transient outage therefore reddens
        # this step -- re-run it; that is the safe direction for a staleness
        # check, and the alternative (a silent pass) is the defect being fixed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lane_state.py --check --verify-live
