name: _prism_functional_routes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore canonical Prism destinations
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/public_prism/src/App.tsx')
          s = p.read_text()
          s = s.replace("'overview'|'commercial'|'knowledge'|'files'|'conversations'|'tasks'|'memory'|'weaver'|'observatory'|'settings'", "'overview'|'projects'|'commercial'|'knowledge'|'files'|'conversations'|'tasks'|'memory'|'weaver'|'observatory'|'settings'")
          s = s.replace("['overview','commercial','knowledge','files','conversations','tasks','memory','weaver','observatory','settings']", "['overview','projects','commercial','knowledge','files','conversations','tasks','memory','weaver','observatory','settings']")
          s = s.replace("if (requested === 'knowledge-os' || requested === 'codex' || requested === 'spiral-codex' || requested === 'encyclopedia') next = {view:'solspire',section:'knowledge',path:'/solspire/knowledge'};", "if (requested === 'knowledge-os' || requested === 'codex') next = {view:'solspire',section:'knowledge',path:'/solspire/knowledge'};")
          s = s.replace("if (requested === 'reasomate') next = {view:'commune',path:'/oracle'};", "if (requested === 'reasomate') next = {view:'commune',path:'/oracle'};")
          s = s.replace("'/codex': {view:'solspire',section:'knowledge'}, '/knowledge-os': {view:'solspire',section:'knowledge'}, '/spiral-codex': {view:'solspire',section:'knowledge'},", "'/codex': {view:'solspire',section:'knowledge'}, '/knowledge-os': {view:'solspire',section:'knowledge'},")
          s = s.replace("'/encyclopedia': {view:'solspire',section:'knowledge'},", "")
          p.write_text(s)
      - name: Verify route ownership
        shell: bash
        run: |
          grep -q "'overview'|'projects'|'commercial'" web/public_prism/src/App.tsx
          ! grep -q "requested === 'spiral-codex'" web/public_prism/src/App.tsx
          ! grep -q "'/encyclopedia': {view:'solspire'" web/public_prism/src/App.tsx
      - name: Commit route restoration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_prism_functional_routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public_prism/src/App.tsx .github/workflows/_prism_functional_routes.yml
          git commit -m "fix(prism): restore canonical network destinations" || exit 0
          git push
